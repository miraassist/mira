name: Idea
description: Something Mira should be able to do.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: German or English, both are fine.
  - type: textarea
    id: want
    attributes:
      label: What you want to do
      description: In your home, in your words. A sentence you would say to Mira helps.
      placeholder: |
        When the washing machine is done, Mira should tell me in the room where I am.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: An automation, another assistant, not at all.
  - type: dropdown
    id: skill
    attributes:
      label: Could it be a skill?
      description: A skill is a text file that tells Mira what to do with the tools she has (see the guide, "Skills").
      options:
        - I do not know
        - Yes, I could write it
        - No, Mira needs something new
