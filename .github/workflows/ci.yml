name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  integration:
    name: HA integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      # ruff with its default rules; the same version as in scripts/check.sh.
      - run: uvx ruff@0.17.3 check custom_components tests
      - run: uvx ruff@0.17.3 format --check custom_components tests
      # The fake speaker reads a sound's length with ffprobe (docs/spec/fake-devices.md).
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv venv --python 3.14 && uv pip install -r requirements_test.txt
      - run: uv run --no-project python -m pytest

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: home-assistant/actions/hassfest@9e9565e68f5a70d874202871f4c4064d23814235 # master
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
