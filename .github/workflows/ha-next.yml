name: Newest Home Assistant

# The integration's tests against the newest Home Assistant release, with the
# packages that release pins (scripts/ha_next.py): a release that breaks the
# integration shows up the day after it came out. Betas are not tested: the
# test plugin comes out for stable releases only.
on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

jobs:
  integration:
    name: HA integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      # The fake speaker reads a sound's length with ffprobe (docs/spec/fake-devices.md).
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - id: newest
        run: python3 scripts/ha_next.py plugin
      - run: uv venv --python 3.14 && uv pip install "pytest-homeassistant-custom-component==${{ steps.newest.outputs.plugin }}"
      - run: uv run --no-project python scripts/ha_next.py pins requirements_test.txt | tee requirements_next.txt
      - run: uv pip install -r requirements_next.txt
      - run: echo "Home Assistant ${{ steps.newest.outputs.ha }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - run: uv run --no-project python -m pytest
