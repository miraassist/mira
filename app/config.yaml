# The Mira service as a Home Assistant app (docs/spec/app.md). The image is the
# one for containers, ghcr.io/miraassist/mira. "version" is set by the release
# workflow once the image of that version is on ghcr.io; do not raise it by hand.
name: Mira
version: "0.17.0"
slug: mira
description: The household voice agent behind the Mira integration.
url: https://github.com/miraassist/mira
arch:
  - amd64
  - aarch64
image: ghcr.io/miraassist/mira
init: false
startup: application
boot: auto
ports:
  8787/tcp: 8787
ports_description:
  8787/tcp: Mira's API; the integration connects here
map:
  - addon_config:rw
environment:
  MIRA_CONFIG: /config/mira.yaml
  MIRA_DATA: /data
  MIRA_LISTEN: 0.0.0.0:8787
# The database goes into Home Assistant's backups through the integration, as
# one consistent copy (docs/spec/backup.md); the app's own backup leaves it out.
backup_exclude:
  - mira.db
  - mira.db-wal
  - mira.db-shm
# Reset (docs/spec/setup.md): on at the next start, Mira deletes its
# data and keeps mira.yaml; once, until turned off and on again.
options:
  reset_data: false
schema:
  reset_data: bool
