send_message:
  fields:
    text:
      required: true
      example: "Die Waschmaschine ist fertig."
      selector:
        text:
    details:
      selector:
        text:
          multiline: true
    importance:
      default: 1
      selector:
        number:
          min: 0
          max: 3
          mode: box
    receiver:
      example: house
      selector:
        text:
    confidentiality:
      default: normal
      selector:
        select:
          options:
            - normal
            - confidential
    dedupe_key:
      example: "washer:done"
      selector:
        text:
    expires_in:
      example: "12h"
      selector:
        text:
    task:
      example: "{{ this.attributes.id }}"
      selector:
        text:

assess:
  fields:
    goal:
      required: true
      example: "Achte auf den Wasserverbrauch."
      selector:
        text:
    observation:
      example: "{{ trigger.to_state.name }} ist {{ trigger.to_state.state }}."
      selector:
        text:
          multiline: true
    data:
      example: '[{"entity_id": "sensor.wasserzahler", "view": "same_hour"}]'
      selector:
        object:
    memory:
      default: relevant
      selector:
        select:
          options: [relevant, profile, none]
    cooldown:
      example: "6h"
      selector:
        text:
    notify:
      default: true
      selector:
        boolean:
    receiver:
      example: house
      selector:
        text:
    confidentiality:
      default: normal
      selector:
        select:
          options: [normal, confidential]
    dedupe_key:
      selector:
        text:
    expires_in:
      example: "12h"
      selector:
        text:
    task:
      example: "{{ this.attributes.id }}"
      selector:
        text:
decide:
  fields:
    question:
      required: true
      example: "Läuft hier gerade unnötig Wasser?"
      selector:
        text:
    observation:
      selector:
        text:
          multiline: true
    data:
      example: '[{"entity_id": "sensor.wasserzahler", "view": "same_hour"}]'
      selector:
        object:
    memory:
      default: relevant
      selector:
        select:
          options: [relevant, profile, none]
    task:
      example: "{{ this.attributes.id }}"
      selector:
        text:
agent:
  fields:
    agent:
      required: true
      example: "delegate"
      selector:
        text:
    input:
      example: '{"input": "Plane ein Menü für Samstag."}'
      selector:
        object:
    mode:
      default: sync
      selector:
        select:
          options: [sync, async]
    timeout:
      default: 60
      selector:
        number:
          min: 1
          max: 3600
          unit_of_measurement: s
          mode: box
    on_timeout:
      default: cancel
      selector:
        select:
          options: [cancel, run_on]
    delivery:
      default: event
      selector:
        select:
          options: [event, message]
    receiver:
      example: house
      selector:
        text:
agent_result:
  fields:
    call_id:
      required: true
      selector:
        text:
agent_cancel:
  fields:
    call_id:
      required: true
      selector:
        text:
