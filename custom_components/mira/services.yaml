add_notice:
  fields:
    text:
      required: true
      example: "Die Waschmaschine ist fertig."
      selector:
        text:
    details:
      selector:
        text:
          multiline: true
    importance:
      default: 1
      selector:
        number:
          min: 0
          max: 3
          mode: box
    audience:
      example: household
      selector:
        text:
    confidentiality:
      default: normal
      selector:
        select:
          options:
            - normal
            - confidential
    dedupe_key:
      example: "washer:done"
      selector:
        text:
    expires_in:
      example: "12h"
      selector:
        text:
