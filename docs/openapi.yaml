openapi: 3.1.0
info:
  title: Mira
  version: 0.26.0
  description: The Mira service's HTTP interface. Generated from the code (go run ./cmd/openapi, docs/spec/openapi.md); every error answers Mira's error body. A partner token names its partner user in X-Partner-User.
tags:
  - name: integration
    description: 'The Home Assistant integration''s interface: conversations, messages, tasks, agents, backup.'
  - name: home-assistant
    description: 'Home Assistant through Mira''s interface (docs/spec/ha-api.md): read an entity, call an action, with Mira''s own connection.'
  - name: skills
    description: Skills' connections and starting a skill's thread.
  - name: access
    description: Who calls (docs/spec/access-tokens.md).
  - name: setup
    description: Pairing and setup of the service (docs/spec/setup.md).
  - name: page
    description: 'Mira''s page''s own routes (/v1/ui/…): they serve the page and may change between versions.'
  - name: description
    description: This description.
security:
  - bearer: []
paths:
  /v1/a2a/push/{call}:
    post:
      tags:
        - integration
      summary: A remote agent's push for a call (A2A)
      description: Takes the call's own token in A2A-Notification-Token or as bearer, not the service's (docs/spec/remote-agents.md).
      operationId: postV1A2aPushCall
      security:
        - {}
      parameters:
        - in: path
          name: call
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/agent:
    post:
      tags:
        - integration
      summary: 'mira.agent: run one of Mira''s agents'
      description: Only with agents.
      operationId: postV1Agent
      parameters:
        - $ref: '#/components/parameters/PartnerUser'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                agent:
                  type: string
                input: true
                mode:
                  type: string
                timeout:
                  type: number
                on_timeout:
                  type: string
                delivery:
                  type: string
                receiver:
                  type: string
              required:
                - agent
                - input
                - mode
                - timeout
                - on_timeout
                - delivery
                - receiver
              additionalProperties: false
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  call_id:
                    type: string
                  agent:
                    type: string
                  status:
                    type: string
                  output: true
                  error:
                    type: string
                  started_at:
                    type: string
                  ended_at:
                    type: string
                required:
                  - call_id
                  - status
                additionalProperties: false
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/agent/cancel:
    post:
      tags:
        - integration
      summary: Cancel an agent's call
      description: Only with agents.
      operationId: postV1AgentCancel
      parameters:
        - $ref: '#/components/parameters/PartnerUser'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/agent/result:
    post:
      tags:
        - integration
      summary: The result of an agent's call that ran on
      description: Only with agents.
      operationId: postV1AgentResult
      parameters:
        - $ref: '#/components/parameters/PartnerUser'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  call_id:
                    type: string
                  agent:
                    type: string
                  status:
                    type: string
                  output: true
                  error:
                    type: string
                  started_at:
                    type: string
                  ended_at:
                    type: string
                required:
                  - call_id
                  - status
                additionalProperties: false
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/agent/skill:
    post:
      tags:
        - skills
      summary: Start a skill's thread (mira.agent with skill)
      description: Only with skills that start from Home Assistant.
      operationId: postV1AgentSkill
      parameters:
        - $ref: '#/components/parameters/PartnerUser'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/assess:
    post:
      tags:
        - integration
      summary: 'mira.assess: judge a situation for an automation, maybe notify'
      operationId: postV1Assess
      parameters:
        - $ref: '#/components/parameters/PartnerUser'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                goal:
                  type: string
                question:
                  type: string
                observation:
                  type: string
                data:
                  type:
                    - "null"
                    - array
                  items:
                    type: object
                    properties:
                      entity_id:
                        type: string
                      view:
                        type: string
                    required:
                      - entity_id
                      - view
                    additionalProperties: false
                memory:
                  type: string
                cooldown:
                  type: string
                notify:
                  type:
                    - "null"
                    - boolean
                task:
                  type: string
                owner:
                  type: string
                receiver:
                  type: string
                confidentiality:
                  type: string
                dedupe_key:
                  type: string
                expires_in:
                  type: string
              required:
                - goal
                - question
                - observation
                - data
                - memory
                - cooldown
                - notify
                - task
                - owner
                - receiver
                - confidentiality
                - dedupe_key
                - expires_in
              additionalProperties: false
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  importance:
                    type: integer
                  spoken:
                    type: string
                  details:
                    type: string
                  message_id:
                    type: string
                  withheld:
                    type: string
                required:
                  - importance
                  - spoken
                  - message_id
                additionalProperties: false
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "503":
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/backup:
    get:
      tags:
        - integration
      summary: Mira's snapshot for Home Assistant's backup (not with a partner token)
      description: Only with backups.
      operationId: getV1Backup
      parameters:
        - $ref: '#/components/parameters/PartnerUser'
      responses:
        "200":
          description: OK
          content:
            application/gzip:
              schema:
                format: binary
                type: string
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/check:
    post:
      tags:
        - integration
      summary: 'mira.check: look at a group of entities'
      operationId: postV1Check
      parameters:
        - $ref: '#/components/parameters/PartnerUser'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scope:
                  type: string
                areas:
                  type:
                    - "null"
                    - array
                  items:
                    type: string
                floors:
                  type:
                    - "null"
                    - array
                  items:
                    type: string
                receiver:
                  type: string
                notify:
                  type:
                    - "null"
                    - boolean
              required:
                - scope
                - areas
                - floors
                - receiver
                - notify
              additionalProperties: false
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  scope:
                    type: string
                  open:
                    type:
                      - "null"
                      - array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        state:
                          type: string
                        area:
                          type: string
                        device:
                          type: string
                        restored:
                          type: boolean
                      required:
                        - id
                        - name
                        - state
                        - area
                      additionalProperties: false
                  unreadable:
                    type:
                      - "null"
                      - array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        state:
                          type: string
                        area:
                          type: string
                        device:
                          type: string
                        restored:
                          type: boolean
                      required:
                        - id
                        - name
                        - state
                        - area
                      additionalProperties: false
                  checked:
                    type: integer
                  message_id:
                    type: string
                required:
                  - scope
                  - open
                  - unreadable
                  - checked
                additionalProperties: false
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "502":
          description: Bad Gateway
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "503":
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/conversation:
    post:
      tags:
        - integration
      summary: 'A turn: what the satellite or the chat heard, Mira''s answer'
      description: 'With stream true (voice), the answer is application/x-ndjson: one line per piece and per tool call, then the whole answer (docs/spec/streaming.md).'
      operationId: postV1Conversation
      parameters:
        - $ref: '#/components/parameters/PartnerUser'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                conversation_id:
                  type: string
                device_id:
                  type: string
                language:
                  type: string
                agent_id:
                  type: string
                extra_system_prompt:
                  type: string
                user_id:
                  type: string
                channel:
                  type: string
                person:
                  type: string
                stream:
                  type: boolean
              required:
                - text
                - conversation_id
                - device_id
                - language
                - agent_id
                - extra_system_prompt
                - user_id
                - channel
                - person
                - stream
              additionalProperties: false
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  text:
                    type: string
                  conversation_id:
                    type: string
                  continue_conversation:
                    type: boolean
                  html:
                    type:
                      - "null"
                      - array
                    items:
                      type: string
                  trace:
                    type:
                      - "null"
                      - array
                    items:
                      type: object
                      properties:
                        kind:
                          type: string
                        name:
                          type: string
                        detail:
                          type: string
                        ms:
                          type: integer
                        tokens:
                          type: integer
                      required:
                        - kind
                      additionalProperties: false
                required:
                  - text
                  - conversation_id
                  - continue_conversation
                additionalProperties: false
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "502":
          description: Bad Gateway
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/conversation/reset:
    post:
      tags:
        - integration
      summary: Forget a conversation's history
      operationId: postV1ConversationReset
      parameters:
        - $ref: '#/components/parameters/PartnerUser'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/decide:
    post:
      tags:
        - integration
      summary: 'mira.decide: a yes or no for an automation'
      operationId: postV1Decide
      parameters:
        - $ref: '#/components/parameters/PartnerUser'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                goal:
                  type: string
                question:
                  type: string
                observation:
                  type: string
                data:
                  type:
                    - "null"
                    - array
                  items:
                    type: object
                    properties:
                      entity_id:
                        type: string
                      view:
                        type: string
                    required:
                      - entity_id
                      - view
                    additionalProperties: false
                memory:
                  type: string
                cooldown:
                  type: string
                notify:
                  type:
                    - "null"
                    - boolean
                task:
                  type: string
                owner:
                  type: string
                receiver:
                  type: string
                confidentiality:
                  type: string
                dedupe_key:
                  type: string
                expires_in:
                  type: string
              required:
                - goal
                - question
                - observation
                - data
                - memory
                - cooldown
                - notify
                - task
                - owner
                - receiver
                - confidentiality
                - dedupe_key
                - expires_in
              additionalProperties: false
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  answer:
                    type: boolean
                  reason:
                    type: string
                required:
                  - answer
                  - reason
                additionalProperties: false
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "503":
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/eval/reset:
    post:
      tags:
        - integration
      summary: Empty Mira's state between eval scenarios
      description: Only in eval mode (docs/spec/evals.md), for tests.
      operationId: postV1EvalReset
      parameters:
        - $ref: '#/components/parameters/PartnerUser'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/ha/services/{domain}/{service}:
    post:
      tags:
        - home-assistant
      summary: Call a Home Assistant action with Mira's connection
      description: The body is the action's data as Home Assistant takes it, the target inside it (entity_id, area_id, …). With return_response, the answer holds the action's response as it came. Tried once; no hooks.
      operationId: postV1HaServicesDomainService
      parameters:
        - in: path
          name: domain
          required: true
          schema:
            type: string
        - in: path
          name: service
          required: true
          schema:
            type: string
        - description: 'Present: ask for the action''s response.'
          in: query
          name: return_response
          schema:
            type: string
        - $ref: '#/components/parameters/PartnerUser'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  response: true
                additionalProperties: false
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "502":
          description: Bad Gateway
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "503":
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/ha/states/{entity_id}:
    get:
      tags:
        - home-assistant
      summary: One entity's state as Home Assistant gives it
      description: Home Assistant's GET /api/states/<entity_id>, with Mira's token, passed on unchanged. One request, no retry.
      operationId: getV1HaStatesEntityId
      parameters:
        - in: path
          name: entity_id
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/PartnerUser'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  entity_id:
                    type: string
                  state:
                    type: string
                  attributes:
                    type: object
                    additionalProperties: true
                  last_changed:
                    type: string
                  last_updated:
                    type: string
                  context:
                    type: object
                    additionalProperties: true
                required:
                  - entity_id
                  - state
                  - attributes
                  - last_changed
                  - last_updated
                additionalProperties: false
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "502":
          description: Bad Gateway
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "503":
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/health:
    get:
      tags:
        - integration
      summary: The service's state, version and id, and its dependencies' checks
      operationId: getV1Health
      parameters:
        - $ref: '#/components/parameters/PartnerUser'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/inbox/paperless:
    post:
      tags:
        - integration
      summary: Paperless's webhook for the inbox (docs/spec/inbox.md)
      description: Takes the inbox's own token (the skill paperless's inbox_token) as bearer, not the service's.
      operationId: postV1InboxPaperless
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "405":
          description: Method Not Allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/mail:
    post:
      tags:
        - integration
      summary: A mail of an IMAP device, for the mail calendar or the inbox
      description: 202 with {queued} when the mail is the inbox's.
      operationId: postV1Mail
      parameters:
        - $ref: '#/components/parameters/PartnerUser'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entry:
                  type: string
                sender:
                  type: string
                subject:
                  type: string
                date:
                  type: string
                text:
                  type: string
                imap_entry:
                  type: string
                uid:
                  type: string
              required:
                - entry
                - sender
                - subject
                - date
                - text
              additionalProperties: false
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  action:
                    type: string
                  reason:
                    type: string
                  title:
                    type: string
                required:
                  - action
                additionalProperties: false
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "422":
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: Internal Server Error
          content:
            application/json:
