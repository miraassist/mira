components:
  securitySchemes:
    bearer:
      description: The integration's token or an access token made on Mira's page (docs/spec/access-tokens.md).
      scheme: bearer
      type: http
  parameters:
    PartnerUser:
      description: The partner user who makes the call; read only with a partner token, ignored with any other.
      in: header
      name: X-Partner-User
      required: false
      schema:
        type: string
  schemas:
    Error:
      properties:
        error:
          description: What failed, naming its input.
          type: string
      required:
        - error
      type: object
