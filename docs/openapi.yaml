                  type: object
                  properties:
                    value: true
                    people:
                      type:
                        - "null"
                        - array
                      items:
                        type: object
                        properties:
                          key:
                            type: string
                          name:
                            type: string
                          entity:
                            type: string
                        required:
                          - key
                          - name
                          - entity
                    managed_by:
                      type: string
                  required:
                    - value
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - page
      summary: Save settings' sections
      description: The body maps a section's name to its new value; a value is free-form, the section as mira.yaml holds it.
