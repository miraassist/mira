name: wecker
description: Wecker an der (Fake-)Show stellen und gleich korrigieren
core: true
steps:
  - say: Weck mich morgen um sechs
    expect:
      result:
        - mira_alarm: { time: "06:00" }
      behaviour:
        must: [thread:wecker, action:alarm.set]
      answer:
        contains: ["6"]
  - say: Nein, halb sieben
    expect:
      result:
        - mira_alarm: { time: "06:30" }
        - mira_alarm: { time: "06:00", not: true }
      behaviour:
        must: [tool:thread_undo]
