name: nachricht-eine-lesen
description: 'Wartet: eine einfache Nachricht ans Haus; Mira nennt sie auf „Hab ich neue Nachrichten?“, ohne etwas anzubieten'
steps:
- message:
    text: Die Waschmaschine ist fertig
- say: Hab ich neue Nachrichten?
  expect:
    behaviour:
      must:
      - tool:messages_read
    answer:
      contains:
      - Waschmaschine
