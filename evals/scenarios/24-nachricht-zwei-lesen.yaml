name: nachricht-zwei-lesen
description: 'Wartet: zwei einfache Nachrichten ans Haus; Mira nennt sie auf „Hab ich neue Nachrichten?“, ohne etwas anzubieten'
steps:
- message:
    text: Die Waschmaschine ist fertig
- message:
    text: Der Trockner ist fertig
- say: Hab ich neue Nachrichten?
  expect:
    behaviour:
      must:
      - tool:messages_read
    answer:
      contains:
      - Waschmaschine
      - Trockner
