name: post-eine-uebrigens
description: 'Wartet: ein Elternbrief mit einem Termin in Annas Postfach; Mira hängt sie mit „Übrigens“ an die Antwort auf
  eine andere Frage und bietet an, sie einzutragen'
steps:
- mail:
    from: sekretariat@grundschule.example
    subject: Elternabend der Klasse 3b
    text: 'Liebe Eltern,

      der Elternabend der Klasse 3b ist am {{+9}} um 19:30 Uhr im Raum 12.

      Viele Grüße

      Frau Berger'
  expect:
    result:
    - message_for:
        receiver: anna
        contains: Elternabend
- say: Wie spät ist es?
  person: anna
  expect:
    behaviour:
      must_not:
      - action:calendar.create
    answer:
      contains:
      - Elternabend
      - eintragen|anfangen|Kalender|soll ich
