name: post-zwei-uebrigens
description: 'Wartet: ein Elternbrief und Terminvorschläge einer Praxis in Annas Postfach; Mira hängt sie mit „Übrigens“ an
  die Antwort auf eine andere Frage und bietet an, sie einzutragen'
steps:
- mail:
    from: sekretariat@grundschule.example
    subject: Elternabend der Klasse 3b
    text: 'Liebe Eltern,

      der Elternabend der Klasse 3b ist am {{+9}} um 19:30 Uhr im Raum 12.

      Viele Grüße

      Frau Berger'
  expect:
    result:
    - message_for:
        receiver: anna
        contains: Elternabend
- mail:
    from: praxis@kieferorthopaedie.example
    subject: Terminvorschläge für die Kontrolle
    text: 'Guten Tag,

      für die Kontrolle bei Dr. Kaya können wir Ihnen {{+11}} um 8:00 Uhr oder {{+12}} um 14:30 Uhr anbieten.

      Bitte wählen Sie einen davon.

      Ihre Praxis Dr. Kaya'
  expect:
    result:
    - message_for:
        receiver: anna
        contains: Kaya
- say: Wie spät ist es?
  person: anna
  expect:
    behaviour:
      must_not:
      - action:calendar.create
    answer:
      contains:
      - Elternabend
      - Kaya|Kieferorthop|Kontroll
      - eintragen|anfangen|Kalender|soll ich
