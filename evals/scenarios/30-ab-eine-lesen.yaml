name: ab-eine-lesen
description: 'Wartet: eine neue Aufnahme auf dem Anrufbeantworter; Mira nennt sie auf „Hab ich neue Nachrichten?“ und bietet
  an, sie abzuspielen'
steps:
- recordings:
  - Oma
- say: Hab ich neue Nachrichten?
  expect:
    behaviour:
      must:
      - tool:messages_read
      must_not:
      - tool:voicemail_play
    answer:
      contains:
      - Oma
      - abspielen|anhören|vorspielen|hören
