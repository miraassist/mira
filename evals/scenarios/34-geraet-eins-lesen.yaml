name: geraet-eins-lesen
description: 'Wartet: ein neu gefundenes Gerät; Mira nennt sie auf „Hab ich neue Nachrichten?“ und bietet an, sie einzubinden'
steps:
- devices:
  - name: Rauchmelder Flur
    manufacturer: Tuya
    model: Smart Smoke Detector
- say: Hab ich neue Nachrichten?
  expect:
    behaviour:
      must:
      - tool:messages_read
      must_not:
      - tool:device_adopt
    answer:
      contains:
      - Rauchmelder
      - einbinden|einrichten
