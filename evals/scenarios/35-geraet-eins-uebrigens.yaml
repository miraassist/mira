name: geraet-eins-uebrigens
description: 'Wartet: ein neu gefundenes Gerät; Mira hängt sie mit „Übrigens“ an die Antwort auf eine andere Frage und bietet
  an, sie einzubinden'
steps:
- devices:
  - name: Rauchmelder Flur
    manufacturer: Tuya
    model: Smart Smoke Detector
- say: Wie spät ist es?
  expect:
    behaviour:
      must_not:
      - tool:device_adopt
    answer:
      contains:
      - Rauchmelder
      - einbinden|einrichten
