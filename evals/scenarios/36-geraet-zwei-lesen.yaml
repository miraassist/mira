name: geraet-zwei-lesen
description: 'Wartet: zwei neu gefundene Geräte; Mira nennt sie auf „Hab ich neue Nachrichten?“ und bietet an, sie einzubinden'
steps:
- devices:
  - name: Rauchmelder Flur
    manufacturer: Tuya
    model: Smart Smoke Detector
  - name: Bewegungsmelder Keller
    manufacturer: HOBEIAN
    model: Motion sensor
- say: Hab ich neue Nachrichten?
  expect:
    behaviour:
      must:
      - tool:messages_read
      must_not:
      - tool:device_adopt
    answer:
      contains:
      - Rauchmelder
      - Bewegungsmelder
      - einbinden|einrichten
