name: geraet-zwei-uebrigens
description: 'Wartet: zwei neu gefundene Geräte; Mira hängt sie mit „Übrigens“ an die Antwort auf eine andere Frage und bietet
  an, sie einzubinden'
steps:
- devices:
  - name: Rauchmelder Flur
    manufacturer: Tuya
    model: Smart Smoke Detector
  - name: Bewegungsmelder Keller
    manufacturer: HOBEIAN
    model: Motion sensor
- say: Wie spät ist es?
  expect:
    behaviour:
      must_not:
      - tool:device_adopt
    answer:
      contains:
      - Rauchmelder
      - Bewegungsmelder
      - einbinden|einrichten
