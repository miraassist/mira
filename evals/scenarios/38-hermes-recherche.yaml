name: hermes-recherche
description: Eine Recherche für den Agenten eines Skills startet dessen Vorgang, nicht den Skill nachdenken
skills: [hermes]
steps:
  - say: Finde heraus, welche Wärmepumpe zu einem Altbau passt
    expect:
      result:
        - remote_received: { contains: Wärmepumpe }
      behaviour:
        must: [thread:hermes]
        must_not: [tool:skill_open:nachdenken, tool:nachdenken]
      answer:
        contains: [Hermes]
