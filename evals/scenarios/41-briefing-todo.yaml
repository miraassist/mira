name: briefing-todo
description: Das Briefing auf Nachfrage nennt Annas überfälliges und heute fälliges To-do aus ihrer eigenen Liste
setup:
  todo:
    - { list: todo.anna, item: Rechnung Stadtwerke bezahlen, due: "-3" }
    - { list: todo.anna, item: Anmeldung Schwimmkurs abgeben, due: "+0" }
    - { list: todo.anna, item: Reifen wechseln, due: "+5" }
steps:
  - say: Was steht heute an?
    person: anna
    expect:
      behaviour:
        must: [tool:todo_due]
      answer:
        contains: [Stadtwerke, Schwimmkurs]
        not_contains: [Reifen]
