name: postfach-termin-frist
description: Mail mit einem Termin und einer Frist; Mira bietet beides zusammen an, ein Ja trägt den Termin ein und setzt die Frist auf die Liste
steps:
  - mail:
      from: sekretariat@grundschule.example
      subject: Elternbrief Klasse 3b
      text: |
        Liebe Eltern,
        der Elternabend der Klasse 3b ist am {{+8}} um 19:30 Uhr in der Aula.
        Bitte geben Sie die Rückmeldung zum Ausflug bis zum {{+4}} ab.
        Viele Grüße, Frau Berger
    expect:
      result:
        - message_for: { receiver: anna, contains: Elternabend }
  - say: Hab ich neue Nachrichten?
    person: anna
    expect:
      behaviour:
        must: [tool:messages_read]
      answer:
        contains: [Elternabend, "Rückmeldung|Ausflug"]
        not_contains: [durchgehen]
  - say: Ja, beides
    person: anna
    expect:
      result:
        - event_exists: { calendar: calendar.anna, day: "+8", start: "19:30", title: Elternabend }
        - todo_item: { list: todo.anna, contains: Rückmeldung, due: "+4" }
      behaviour:
        must: [action:calendar.create, action:todo.create]
