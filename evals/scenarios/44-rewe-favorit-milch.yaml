name: rewe-favorit-milch
description: "RW-10: Milch auf dem Zettel wird die Lieblingsmilch aus den Favoriten, nicht der erste Suchtreffer und nicht die meistgekaufte"
skills: [rewe]
setup:
  todo:
    - { list: todo.wocheneinkauf, item: Milch }
    - { list: todo.wocheneinkauf, item: 7 Packungen Kaffee }
steps:
  - say: Bestell den Einkaufszettel bei REWE
    expect:
      result:
        - rewe_basket: { contains: Schwarzwaldmilch }
        - rewe_basket: { contains: ja! Frische Vollmilch, not: true }
        - rewe_orders: { count: 0 }
      behaviour:
        must: ["tool:skill_open:rewe", "tool:rewe__basket_fill", "blocked:rewe__order"]
