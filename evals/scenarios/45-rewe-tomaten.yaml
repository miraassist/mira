name: rewe-tomaten
description: "RW-11: Was kein Favorit ist, kommt aus der Bestellhistorie oder der Suche"
skills: [rewe]
setup:
  todo:
    - { list: todo.wocheneinkauf, item: Tomaten }
    - { list: todo.wocheneinkauf, item: 7 Packungen Kaffee }
steps:
  - say: Bestell den Einkaufszettel bei REWE
    expect:
      result:
        - rewe_basket: { contains: Rispentomaten }
        - rewe_basket: { contains: Tchibo }
        - rewe_orders: { count: 0 }
      behaviour:
        must: ["tool:rewe__basket_fill", "blocked:rewe__order"]
      answer:
        not_contains: [geraten]
