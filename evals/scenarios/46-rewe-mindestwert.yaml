name: rewe-mindestwert
description: "RW-12: Unter dem Mindestbestellwert sagt Mira, was fehlt, und bestellt nicht"
skills: [rewe]
setup:
  todo:
    - { list: todo.wocheneinkauf, item: Milch }
    - { list: todo.wocheneinkauf, item: Butter }
steps:
  - say: Bestell den Einkaufszettel bei REWE
    expect:
      result:
        - rewe_basket: { contains: Kerrygold }
        - rewe_orders: { count: 0 }
      behaviour:
        must_not: ["tool:rewe__order"]
      answer:
        contains: ["Mindest", "55|fünfundfünfzig"]
