name: rewe-donnerstag
description: "RW-13: Der Wunsch des Haushalts aus dem Gedächtnis bestimmt das Lieferfenster"
skills: [rewe]
setup:
  facts:
    - { owner: house, text: "REWE soll am liebsten donnerstags liefern, dann ist die Lieferung gratis." }
  todo:
    - { list: todo.wocheneinkauf, item: Milch }
    - { list: todo.wocheneinkauf, item: 7 Packungen Kaffee }
steps:
  - say: Bestell den Einkaufszettel bei REWE
    expect:
      result:
        - rewe_orders: { count: 0 }
      behaviour:
        must: ["tool:rewe__checkout_prepare", "blocked:rewe__order"]
      answer:
        contains: [Donnerstag, "?"]
