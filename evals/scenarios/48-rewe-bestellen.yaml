name: rewe-bestellen
description: "RW-14: Eine Frage mit Betrag, Lieferfenster und Zahlungsart; nach dem Ja ist bestellt und der Zettel abgehakt"
core: true
skills: [rewe]
setup:
  todo:
    - { list: todo.wocheneinkauf, item: Milch }
    - { list: todo.wocheneinkauf, item: 7 Packungen Kaffee }
steps:
  - say: Bestell den Einkaufszettel bei REWE
    expect:
      result:
        - rewe_orders: { count: 0 }
        - todo_item: { list: todo.wocheneinkauf, contains: Kaffee, status: needs_action }
      behaviour:
        must: ["blocked:rewe__order"]
      answer:
        contains: ["?", "Euro", "PayPal"]
  - say: Ja
    expect:
      result:
        - rewe_orders: { count: 1, contains: Tchibo }
        - rewe_orders: { contains: Schwarzwaldmilch }
        - todo_item: { list: todo.wocheneinkauf, contains: Kaffee, status: completed }
        - todo_item: { list: todo.wocheneinkauf, contains: Milch, status: completed }
      behaviour:
        must: ["tool:rewe__order", "tool:ha__todo__HassListCompleteItem"]
