name: rewe-nein
description: "RW-15: Nach einem Nein ist nichts bestellt, der Korb bleibt und der Zettel auch"
core: true
skills: [rewe]
setup:
  todo:
    - { list: todo.wocheneinkauf, item: Milch }
    - { list: todo.wocheneinkauf, item: 7 Packungen Kaffee }
steps:
  - say: Bestell den Einkaufszettel bei REWE
    expect:
      result:
        - rewe_orders: { count: 0 }
      answer:
        contains: ["?"]
  - say: Nein
    expect:
      result:
        - rewe_orders: { count: 0 }
        - rewe_basket: { contains: Tchibo }
        - todo_item: { list: todo.wocheneinkauf, contains: Kaffee, status: needs_action }
      behaviour:
        must_not: ["tool:ha__todo__HassListCompleteItem"]
