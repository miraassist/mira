name: rewe-lieferung
description: "RW-17: Wann die Lieferung kommt: Lieferfenster und Betrag der offenen Bestellung"
skills: [rewe]
setup:
  rewe:
    open_order:
      - { search: Kaffee, qty: 7 }
steps:
  - say: Wann kommt die REWE-Lieferung?
    expect:
      result:
        - rewe_orders: { count: 1 }
      behaviour:
        must: ["tool:rewe__orders"]
        must_not: ["tool:rewe__modification_start", "tool:rewe__order_cancel"]
      answer:
        contains: ["Uhr", "62"]
