name: rewe-nicht-angemeldet
description: "RW-18: Ohne Anmeldung sagt Mira, dass ein Admin korb neu anmelden muss, und versucht nichts weiter"
skills: [rewe]
setup:
  rewe:
    logged_in: false
  todo:
    - { list: todo.wocheneinkauf, item: Milch }
steps:
  - say: Bestell den Einkaufszettel bei REWE
    expect:
      behaviour:
        must_not: ["tool:rewe__basket_set", "tool:rewe__checkout_prepare", "tool:rewe__order"]
      answer:
        contains: ["Anmeldung|angemeldet|anmelden", "Admin"]
