<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mira</title>
<link rel="icon" type="image/png" href="/ui/icon.png">
<style>
:root {
  --bg: #f6f6f4; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #dddcd6;
  --accent: #2b8577; --accent-text: #ffffff; --warn: #a3471b; --badge: #ece9df;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161715; --panel: #1f201e; --text: #e8e7e2; --muted: #9a9993; --line: #33342f;
    --accent: #7dd8c6; --accent-text: #0f1a16; --warn: #e08a5f; --badge: #2b2c28;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, sans-serif; }
header { display: flex; align-items: center; gap: 16px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
header h1 { font-size: 18px; margin: 0; display: flex; align-items: center; gap: 8px; }
header h1 img { width: 32px; height: 32px; }
#lang { margin-left: auto; width: auto; }
nav { display: flex; gap: 4px; flex-wrap: wrap; }
nav button { background: none; border: 0; padding: 6px 10px; border-radius: 6px; color: var(--muted); cursor: pointer; font: inherit; }
nav button.active { background: var(--badge); color: var(--text); }
main { max-width: 920px; margin: 0 auto; padding: 16px; }
section.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
h2 { font-size: 16px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
h3 { font-size: 14px; margin: 16px 0 8px; color: var(--muted); font-weight: 600; }
.badge { font-size: 12px; font-weight: 500; background: var(--badge); color: var(--muted); padding: 2px 8px; border-radius: 10px; }
.badge.ui { color: var(--accent); }
.grid { display: grid; grid-template-columns: minmax(140px, 220px) 1fr; gap: 8px 12px; align-items: center; }
.grid label { color: var(--muted); }
input, select, textarea { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; width: 100%; }
textarea { min-height: 60px; resize: vertical; }
input[type=checkbox] { width: auto; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row > * { flex: 1 1 140px; }
button.primary, button.secondary, button.danger { font: inherit; border-radius: 6px; padding: 6px 12px; cursor: pointer; border: 1px solid var(--line); }
button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
button.secondary { background: var(--panel); color: var(--text); }
button.danger { background: var(--panel); color: var(--warn); }
.actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
.chip { display: inline-flex; align-items: center; gap: 4px; background: var(--badge); border-radius: 12px; padding: 2px 4px 2px 10px; font-size: 13px; }
.chip small { color: var(--muted); }
.chip button { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 0 4px; font-size: 15px; }
.item { border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
.hint { color: var(--muted); font-size: 13px; margin: 4px 0 0; }
.msg { padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; white-space: pre-wrap; }
.msg.err { background: color-mix(in srgb, var(--warn) 15%, transparent); color: var(--warn); }
.msg.ok { background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent); }
table { width: 100%; border-collapse: collapse; }
td, th { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 500; font-size: 13px; }
pre { white-space: pre-wrap; margin: 0; font: inherit; }
@media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>

const TABS = ["notices", "notifier", "watchers", "rooms", "persons", "memory"];
let token = localStorage.getItem("mira.token") || "";
// The page's language: the visitor's choice, else the browser's.
let lang = localStorage.getItem("mira.lang") || ((navigator.language || "").toLowerCase().startsWith("de") ? "de" : "en");
if (!I18N[lang]) lang = "en";
let T = I18N[lang];
document.documentElement.lang = lang;
function setLang(l) {
  lang = l; T = I18N[l]; document.documentElement.lang = l;
  try { localStorage.setItem("mira.lang", l); } catch (e) {}
  render();
}
let config = {};
let tab = location.hash.slice(1) || "notices";
let entityNames = {};
// Sections Home Assistant manages are edited there, as subentries of the
// Mira integration; the page shows them read-only.
const managed = name => (config[name] || {}).managed_by === "home_assistant";

const $ = (sel, root = document) => root.querySelector(sel);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function api(method, path, body) {
  const res = await fetch(path, {
    method, headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) { askToken(); throw new Error(T.token_wrong); }
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function askToken() {
  const t = prompt(T.token_ask, "");
  if (t) { token = t.trim(); localStorage.setItem("mira.token", token); load(); }
}

function message(text, ok) {
  const box = $("#msg");
  if (!box) return;
  box.className = "msg " + (ok ? "ok" : "err");
  box.textContent = text;
  box.hidden = false;
  if (ok) setTimeout(() => { box.hidden = true; }, 3000);
}

async function save(sections) {
  try {
    config = await api("PUT", "/v1/ui/config", sections);
    message(T.saved, true);
    render();
  } catch (e) { message(e.message, false); }
}

async function reset(name) {
  if (!confirm(T.reset_confirm)) return;
  try {
    config = await api("DELETE", "/v1/ui/config/" + name);
    message(T.reset_done, true);
    render();
  } catch (e) { message(e.message, false); }
}

function source(name) {
  const s = config[name];
  if (!s) return "";
  if (managed(name) && name !== "notifier")
    return `<span class="badge ui">${T.badge_ha}</span>`;
  return s.overridden
    ? `<span class="badge ui">${T.badge_ui}</span> <button class="secondary" onclick="reset('${name}')">${T.reset_button}</button>`
    : `<span class="badge">${T.badge_file}</span>`;
}

const val = name => (config[name] || {}).value;
const list = v => (Array.isArray(v) ? v : v ? [v] : []);
const csv = v => list(v).join(", ");
const fromCsv = s => s.split(",").map(x => x.trim()).filter(Boolean);
const lines = s => s.split("\n").map(x => x.trim()).filter(Boolean);
const num = (s, def) => (s === "" || s === undefined ? def : Number(s));
const opt = (value, current, label) => `<option value="${esc(value)}"${String(value) === String(current ?? "") ? " selected" : ""}>${esc(label ?? value)}</option>`;

function nav() {
  $("#nav").innerHTML = TABS.map(id =>
    `<button class="${id === tab ? "active" : ""}" onclick="go('${id}')">${T["tab_" + id]}</button>`).join("");
  $("#lang").value = lang;
}
function go(id) { tab = id; location.hash = id; render(); }

function render() {
  nav();
  const views = { notices, notifier, watchers, rooms, persons, memory };
  $("#main").innerHTML = `<div id="msg" class="msg" hidden></div><div id="view"></div>`;
  views[tab]();
  const owner = { watchers: "watchers", rooms: "satellites", persons: "persons" }[tab];
  if (owner && managed(owner)) {
    $("#view").querySelectorAll("input, textarea, select, button").forEach(el => { el.disabled = true; });
    $("#view").querySelectorAll(".actions").forEach(el => { el.hidden = true; });
    $("#view").insertAdjacentHTML("afterbegin", `<p class="msg ok">${T.managed_hint}</p>`);
  }
}

// Entity picker: chips for the chosen entities, a search field with the
// Home Assistant entities as suggestions (by id, name and area).
function chip(id) {
  const name = entityNames[id];
  return `<span class="chip" data-id="${esc(id)}">${esc(name || id)}${name ? ` <small>${esc(id)}</small>` : ""}<button type="button" title="${T.remove}" onclick="this.parentNode.remove()">×</button></span>`;
}
function entityPicker(field, ids) {
  return `<div><div class="chips" data-f="${field}">${list(ids).map(chip).join("")}</div>
    <input list="entities" placeholder="${T.entity_search}" onchange="pickEntity(this)"></div>`;
}
function pickEntity(input) {
  const id = input.value.trim();
  input.value = "";
  if (!/^[a-z_]+\.[a-z0-9_]+$/.test(id)) { message(T.not_entity.replace("{id}", id), false); return; }
  const chips = input.previousElementSibling;
  if (![...chips.children].some(c => c.dataset.id === id)) chips.insertAdjacentHTML("beforeend", chip(id));
}
const picked = el => [...el.children].map(c => c.dataset.id);

// ---- Meldungen ----------------------------------------------------------
async function notices() {
  const view = $("#view");
  view.innerHTML = `<section class="card"><h2>${T.notices_title}</h2><div id="list">${T.loading}</div></section>`;
  try {
    const items = await api("GET", "/v1/ui/notices");
    $("#list").innerHTML = items.length === 0 ? `<p class="hint">${T.no_notices}</p>` : `
      <table><tr><th>${T.since}</th><th>${T.importance}</th><th>${T.notice}</th><th>${T.status}</th><th></th></tr>
      ${items.map(n => `<tr>
        <td>${esc(n.created_at)}</td>
        <td>${T.importance_short[n.importance] || n.importance}</td>
        <td>${esc(n.spoken)}${n.confidentiality === "confidential" ? ' <span class="badge">' + T.confidential + '</span>' : ""}
            ${n.details ? `<p class="hint">${esc(n.details)}</p>` : ""}</td>
        <td>${n.state === "pending" ? T.waiting : T.delivered + (n.delivered_via ? " (" + esc(n.delivered_via) + ")" : "")}</td>
        <td><button class="secondary" onclick="ack('${esc(n.id)}')">${T.done}</button></td></tr>`).join("")}
      </table>`;
  } catch (e) { message(e.message, false); }
}
async function ack(id) {
  try { await api("POST", `/v1/ui/notices/${encodeURIComponent(id)}/ack`); notices(); } catch (e) { message(e.message, false); }
}

// ---- Benachrichtigung ---------------------------------------------------
function notifier() {
  const n = val("notifier") || {};
  const qh = n.quiet_hours || {}, esc2 = n.escalate_to_telegram || {}, urg = n.urgent || {};
  const via = list(n.private_via);
  $("#view").innerHTML = `
  <section class="card">
    <h2>${T.tab_notifier} ${source("notifier")}</h2>
    <h3>${T.when_announce}</h3>
    <div class="grid">
      <label>${T.quiet_from}</label><input type="time" id="qh_from" value="${esc(qh.from)}">
      <label>${T.quiet_to}</label><input type="time" id="qh_to" value="${esc(qh.to)}">
      <label>${T.cooldown}</label><input id="cooldown" value="${esc(n.cooldown)}" placeholder="30m">
      <label>${T.max_items}</label><input type="number" min="1" max="10" id="max_items" value="${esc(n.max_items_per_announcement)}">
      <label>${T.min_importance}</label><select id="min_importance">${[0,1,2,3].map(i => opt(i, n.min_importance, T.min_levels[i])).join("")}</select>
      <label>${T.follow_up}</label><input id="follow_up" value="${esc(n.follow_up_window)}" placeholder="2m">
      <label>${T.delivery}</label><select id="delivery">${["auto", "start_conversation", "announce", "tts"].map(d => opt(d, n.delivery)).join("")}</select>
      <label>${T.tts_entity}</label><input id="tts_entity" list="entities" value="${esc(n.tts_entity)}" placeholder="tts.piper">
    </div>
    <h3>${T.confidential_title}</h3>
    <div class="grid">
      <label>${T.conf_voice}</label><select id="conf_voice">
        ${opt("never", n.confidential_voice, T.conf_never)}
        ${opt("when_alone", n.confidential_voice, T.conf_alone)}
        ${opt("always", n.confidential_voice, T.conf_always)}</select>
      <label>${T.private_via}</label><div class="row">
        <label><input type="checkbox" id="via_telegram" ${via.includes("telegram") ? "checked" : ""}> Telegram</label>
        <label><input type="checkbox" id="via_push" ${via.includes("push") ? "checked" : ""}> ${T.companion}</label></div>
    </div>
    <h3>${T.escalation}</h3>
    <div class="grid">
      <label>${T.from_importance}</label><select id="esc_min">${[1,2,3].map(i => opt(i, esc2.min_importance)).join("")}</select>
      <label>${T.unheard_after}</label><input type="time" id="esc_after" value="${esc(esc2.after)}">
      <label>${T.grace}</label><input id="esc_grace" value="${esc(esc2.grace)}" placeholder="30m">
    </div>
    <p class="hint">${T.escalation_hint}</p>
    <h3>${T.urgent}</h3>
    <div class="grid">
      <label>${T.urgent_from}</label><select id="urg_min">${opt(0, urg.min_importance, T.off)}${[1,2,3].map(i => opt(i, urg.min_importance)).join("")}</select>
      <label>${T.urgent_announce}</label><input type="checkbox" id="urg_announce" ${urg.announce ? "checked" : ""}>
    </div>
    <p class="hint">${T.urgent_hint}</p>
    <div class="actions"><button class="primary" onclick="saveNotifier()">${T.save}</button></div>
  </section>`;
}
function saveNotifier() {
  const n = structuredClone(val("notifier") || {});
  n.quiet_hours = { from: $("#qh_from").value, to: $("#qh_to").value };
  n.cooldown = $("#cooldown").value.trim();
  n.max_items_per_announcement = num($("#max_items").value, 3);
  n.min_importance = num($("#min_importance").value, 1);
  n.follow_up_window = $("#follow_up").value.trim();
  n.delivery = $("#delivery").value;
  n.tts_entity = $("#tts_entity").value.trim();
  n.confidential_voice = $("#conf_voice").value;
  n.private_via = [$("#via_telegram").checked && "telegram", $("#via_push").checked && "push"].filter(Boolean);
  n.escalate_to_telegram = { min_importance: num($("#esc_min").value, 2), after: $("#esc_after").value, grace: $("#esc_grace").value.trim() };
  n.urgent = { min_importance: num($("#urg_min").value, 3), announce: $("#urg_announce").checked };
  save({ notifier: n });
}

// ---- Watcher ------------------------------------------------------------
let draftWatchers = null;
function watchers() {
  if (!draftWatchers) draftWatchers = structuredClone(val("watchers") || []);
  const persons = Object.keys(val("persons") || {});
  $("#view").innerHTML = `
  <section class="card">
    <h2>${T.tab_watchers} ${source("watchers")}</h2>
    <p class="hint">${T.watchers_hint}</p>
    ${draftWatchers.map((w, i) => watcherForm(w, i, persons)).join("")}
    <div class="actions">
      <button class="secondary" onclick="addWatcher('trigger')">${T.add_trigger}</button>
      <button class="secondary" onclick="addWatcher('rss')">${T.add_feed}</button>
      <button class="primary" onclick="saveWatchers()">${T.save}</button>
      <button class="secondary" onclick="draftWatchers=null; watchers()">${T.discard}</button>
    </div>
  </section>`;
}
function watcherForm(w, i, persons) {
  const isFeed = !!w.schedule || w.kind === "rss";
  const t = w.trigger || {};
  return `<div class="item" data-i="${i}">
    <div class="grid">
      <label>${T.name}</label><input data-f="name" value="${esc(w.name)}">
      ${isFeed ? `
        <label>${T.feed_url}</label><input data-f="url" value="${esc(w.url)}" placeholder="https://…">
        <label>${T.schedule}</label><input data-f="schedule" value="${esc(w.schedule)}" placeholder="0 8 * * *">
      ` : `
        <label>${T.entities}</label>${entityPicker("entity_id", t.entity_id)}
        <label>${T.to_state}</label><input data-f="to" value="${esc(csv(t.to))}" placeholder="${T.to_placeholder}">
        <label>${T.not_to_state}</label><input data-f="not_to" value="${esc(csv(t.not_to))}" placeholder="${T.not_to_placeholder}">
      `}
      <label>${T.meaning}</label><textarea data-f="description" placeholder="${T.meaning_placeholder}">${esc(w.description)}</textarea>
      <label>${T.importance}</label><select data-f="importance">${opt("", w.importance, T.model_rates)}${[0,1,2,3].map(x => opt(x, w.importance, T.levels[x])).join("")}</select>
      <label>${T.for}</label><select data-f="audience">${opt("", w.audience, T.household)}${persons.map(p => opt(p, w.audience)).join("")}</select>
      <label>${T.confidential_label}</label><select data-f="confidentiality">${opt("", w.confidentiality, T.no)}${opt("confidential", w.confidentiality, T.yes)}</select>
    </div>
    <div class="actions"><button class="danger" onclick="removeWatcher(${i})">${T.remove}</button></div>
  </div>`;
}
function readWatchers() {
  document.querySelectorAll("[data-i]").forEach(el => {
    const w = draftWatchers[Number(el.dataset.i)];
    const f = name => el.querySelector(`[data-f="${name}"]`);
    w.name = f("name").value.trim();
    w.description = f("description").value.trim();
    const imp = f("importance").value;
    if (imp === "") delete w.importance; else w.importance = Number(imp);
    if (f("audience").value) w.audience = f("audience").value; else delete w.audience;
    if (f("confidentiality").value) w.confidentiality = f("confidentiality").value; else delete w.confidentiality;
    if (f("url")) {
      w.kind = "rss"; w.url = f("url").value.trim(); w.schedule = f("schedule").value.trim(); delete w.trigger;
    } else {
      // Keep fields the form does not show (from, not_from).
      w.trigger = Object.assign({}, w.trigger, { entity_id: picked(f("entity_id")) });
      const to = fromCsv(f("to").value), notTo = fromCsv(f("not_to").value);
      if (to.length) w.trigger.to = to; else delete w.trigger.to;
      if (notTo.length) w.trigger.not_to = notTo; else delete w.trigger.not_to;
    }
    for (const k of Object.keys(w)) if (w[k] === "" || w[k] === null) delete w[k];
  });
}
function addWatcher(kind) {
  readWatchers();
  draftWatchers.push(kind === "rss" ? { name: "", kind: "rss", schedule: "0 8 * * *", url: "" } : { name: "", trigger: { entity_id: [] } });
  watchers();
}
function removeWatcher(i) { readWatchers(); draftWatchers.splice(i, 1); watchers(); }
async function saveWatchers() { readWatchers(); await save({ watchers: draftWatchers }); draftWatchers = null; }

// ---- Räume --------------------------------------------------------------
function rooms() {
  const sats = val("satellites") || {}, n = val("notifier") || {}, mt = n.morning_trigger || {};
  const presence = mt.presence || {}, areas = new Set([...Object.keys(sats), ...list(mt.areas)]);
  const rows = [...areas].sort().map(a => ({ area: a, sat: sats[a] || "", sensor: presence[a] || "", active: list(mt.areas).includes(a) }));
  $("#view").innerHTML = `
  <section class="card">
    <h2>${T.tab_rooms} ${source("satellites")}</h2>
    <p class="hint">${T.rooms_hint}</p>
    <table id="rooms"><tr><th>${T.area}</th><th>${T.satellite}</th><th>${T.motion}</th><th>${T.announcements}</th><th></th></tr>
      ${rows.map((r, i) => roomRow(r, i)).join("")}
    </table>
    <div class="actions">
      <button class="secondary" onclick="addRoom()">${T.add_room}</button>
      <button class="primary" onclick="saveRooms()">${T.save}</button>
    </div>
  </section>`;
}
function roomRow(r, i) {
  return `<tr data-r="${i}">
    <td><input data-f="area" value="${esc(r.area)}"></td>
    <td><input data-f="sat" list="entities" value="${esc(r.sat)}" placeholder="assist_satellite.…"></td>
    <td><input data-f="sensor" list="entities" value="${esc(r.sensor)}" placeholder="binary_sensor.…"></td>
    <td><input type="checkbox" data-f="active" ${r.active ? "checked" : ""}></td>
    <td><button class="danger" onclick="this.closest('tr').remove()">×</button></td></tr>`;
}
function addRoom() {
  $("#rooms").insertAdjacentHTML("beforeend", roomRow({ area: "", sat: "", sensor: "", active: true }, Date.now()));
}
function saveRooms() {
  const sats = {}, presence = {}, areas = [];
  document.querySelectorAll("[data-r]").forEach(tr => {
    const f = name => tr.querySelector(`[data-f="${name}"]`);
    const area = f("area").value.trim();
    if (!area) return;
    if (f("sat").value.trim()) sats[area] = f("sat").value.trim();
    if (f("sensor").value.trim()) presence[area] = f("sensor").value.trim();
    if (f("active").checked) areas.push(area);
  });
  const n = structuredClone(val("notifier") || {});
  n.morning_trigger = { areas, presence };
  save({ satellites: sats, notifier: n });
}

// ---- Personen -----------------------------------------------------------
function persons() {
  const p = val("persons") || {};
  $("#view").innerHTML = `
  <section class="card">
    <h2>${T.tab_persons} ${source("persons")}</h2>
    <p class="hint">${T.persons_hint}</p>
    <table id="persons"><tr><th>${T.key}</th><th>${T.person_entity}</th><th>${T.telegram_id}</th><th>${T.push}</th><th></th></tr>
      ${Object.entries(p).sort().map(([k, v], i) => personRow(k, v, i)).join("")}
    </table>
    <div class="actions">
      <button class="secondary" onclick="addPerson()">${T.add_person}</button>
      <button class="primary" onclick="savePersons()">${T.save}</button>
    </div>
  </section>`;
}
function personRow(key, p, i) {
  return `<tr data-p="${i}">
    <td><input data-f="key" value="${esc(key)}"></td>
    <td><input data-f="entity" list="entities" value="${esc(p.entity)}" placeholder="person.…"></td>
    <td><input data-f="tg" value="${esc(p.telegram_user_id || "")}" inputmode="numeric"></td>
    <td><input data-f="notify" value="${esc(p.notify)}" placeholder="notify.mobile_app_…"></td>
    <td><button class="danger" onclick="this.closest('tr').remove()">×</button></td></tr>`;
}
function addPerson() { $("#persons").insertAdjacentHTML("beforeend", personRow("", {}, Date.now())); }
function savePersons() {
  const out = {};
  document.querySelectorAll("[data-p]").forEach(tr => {
    const f = name => tr.querySelector(`[data-f="${name}"]`).value.trim();
    if (!f("key")) return;
    const p = { entity: f("entity") };
    if (f("tg")) p.telegram_user_id = Number(f("tg"));
    if (f("notify")) p.notify = f("notify");
    out[f("key")] = p;
  });
  save({ persons: out });
}

// ---- Gedächtnis ---------------------------------------------------------
async function memory() {
  $("#view").innerHTML = `<section class="card"><h2>${T.profile}</h2><div id="profile">${T.loading}</div></section>
    <section class="card"><h2>${T.facts}</h2><div id="facts"></div></section>`;
  try {
    const m = await api("GET", "/v1/ui/memory");
    $("#profile").innerHTML = `
      ${m.profile ? `<pre>${esc(m.profile)}</pre>` : `<p class="hint">${T.no_profile}</p>`}
      <p class="hint">${m.profile_updated ? T.last_compacted + esc(m.profile_updated) + ". " : ""}${T.profile_hint}</p>
      <div class="actions"><button class="secondary" id="compact" onclick="compact()">${T.compact_now}</button></div>`;
    $("#facts").innerHTML = m.facts.length === 0 ? `<p class="hint">${T.no_facts}</p>` : `
      <table>${m.facts.map(f => `<tr><td>${esc(f.text)}<p class="hint">${esc(f.updated)}</p></td>
        <td><button class="danger" onclick="forget('${esc(f.id)}')">${T.forget}</button></td></tr>`).join("")}</table>`;
  } catch (e) { message(e.message, false); }
}
async function forget(id) {
  if (!confirm(T.forget_confirm)) return;
  try { await api("DELETE", "/v1/ui/memory/" + encodeURIComponent(id)); memory(); } catch (e) { message(e.message, false); }
}
async function compact() {
  $("#compact").disabled = true;
  $("#compact").textContent = T.compacting;
  try {
    const r = await api("POST", "/v1/ui/memory/compact");
    await memory();
    message(r.changed ? T.profile_updated : T.profile_unchanged, true);
  } catch (e) { message(e.message, false); memory(); }
}

// ---- Start --------------------------------------------------------------
async function load() {
  // Without a stored token the first call answers 401 and asks for one;
  // an agent without server.token needs none.
  try {
    config = await api("GET", "/v1/ui/config");
    render();
    const ents = await api("GET", "/v1/ui/entities");
    entityNames = Object.fromEntries((ents || []).map(e => [e.id, [e.name, e.area].filter(Boolean).join(" · ")]));
    $("#entities").innerHTML = (ents || []).map(e => `<option value="${esc(e.id)}">${esc([e.name, e.area].filter(Boolean).join(" · "))}</option>`).join("");
    if (tab === "watchers") render(); // chips with names
  } catch (e) { render(); message(e.message, false); }
}
window.addEventListener("hashchange", () => { tab = location.hash.slice(1) || "notices"; draftWatchers = null; render(); });
load();
</script>
