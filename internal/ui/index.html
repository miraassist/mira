<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Recordings of the guide come from their own server: it does not learn where they are watched. -->
<meta name="referrer" content="no-referrer">
<title>Mira</title>
<style>
/* Mira's palette, taken from the logo: rose, magenta, teal, mint on a soft ink. */
:root {
  --rose: #f394aa; --magenta: #d35fa5; --teal: #3f95a0; --mint: #8fdac5; --ink: #3b3a3e;
  --grad: linear-gradient(120deg, var(--rose), var(--magenta) 38%, var(--teal) 72%, var(--mint));
  --bg: #fbf8f9; --panel: #ffffff; --text: var(--ink); --muted: #7a7480; --line: #ece5ea;
  --accent: #2f7f8a; --accent-2: #3f95a0; --accent-text: #ffffff; --warn: #b9407a; --badge: #f4eef2;
  --ok-tint: color-mix(in srgb, var(--mint) 28%, var(--panel)); --rose-tint: color-mix(in srgb, var(--rose) 18%, var(--panel));
  --shadow: 0 1px 2px rgb(80 40 70 / 5%), 0 6px 20px rgb(160 70 130 / 6%);
  --radius: 16px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #18161a; --panel: #221f25; --text: #ede8ef; --muted: #a59ea9; --line: #352f39;
    --accent: #8fdac5; --accent-2: #6cc3b2; --accent-text: #10201c; --warn: #f394aa; --badge: #2d2930;
    --shadow: 0 1px 2px rgb(0 0 0 / 30%), 0 8px 24px rgb(0 0 0 / 25%);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; color: var(--text); font: 15px/1.5 ui-rounded, "SF Pro Rounded", "Nunito", "Varela Round", system-ui, sans-serif;
  background:
    radial-gradient(900px 420px at 0% -10%, color-mix(in srgb, var(--rose) 14%, transparent), transparent 70%),
    radial-gradient(900px 420px at 100% -10%, color-mix(in srgb, var(--mint) 16%, transparent), transparent 70%),
    var(--bg);
  background-attachment: fixed; min-height: 100vh;
}
header {
  display: flex; align-items: center; gap: 12px; padding: 12px 20px; flex-wrap: wrap; position: sticky; top: 0; z-index: 5;
  background: color-mix(in srgb, var(--panel) 85%, transparent); backdrop-filter: blur(10px);
  border-bottom: 3px solid; border-image: var(--grad) 1;
}
header h1 { font-size: 22px; font-weight: 800; letter-spacing: .2px; margin: 0; display: flex; align-items: center; gap: 10px; }
header h1 img { width: 36px; height: 36px; }
#lang { margin-left: auto; width: auto; border-radius: 999px; padding: 4px 10px; }
nav { display: flex; gap: 4px; flex-wrap: wrap; }
nav button { background: none; border: 0; padding: 6px 11px; border-radius: 999px; color: var(--muted); cursor: pointer; font: inherit; font-weight: 600; transition: background .15s, color .15s; }
nav button:hover { color: var(--text); background: var(--badge); }
nav button.active { color: var(--text); background: linear-gradient(120deg, color-mix(in srgb, var(--rose) 28%, transparent), color-mix(in srgb, var(--mint) 34%, transparent)); }
mira-nav { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
mira-nav button.back { border: 0; background: none; color: var(--muted); font-weight: 600; padding: 6px 8px; }
mira-nav .group-title { font-weight: 700; margin: 0 8px 0 2px; }
/* The start page: a card per group, as Home Assistant's settings page. */
.home-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); grid-auto-rows: 1fr; gap: 20px; }
.home-card { cursor: pointer; margin: 0; padding: 22px 24px; min-height: 190px; display: flex; flex-direction: column; transition: box-shadow .15s, transform .15s; }
.home-card h2 { font-size: 21px; }
.home-teaser { margin: 6px 0 4px; }
.home-pages { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 2px 0 6px; }
.home-pages a { color: var(--accent); font-weight: 700; font-size: 16px; text-decoration: none; }
.home-pages a:hover, .home-pages a:focus-visible { text-decoration: underline; }
.home-facts { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--line); }
.home-card:hover, .home-card:focus-visible { transform: translateY(-1px); box-shadow: 0 2px 4px rgb(80 40 70 / 8%), 0 10px 28px rgb(160 70 130 / 12%); }
.home-card h2 { margin-bottom: 2px; }
.home-line { margin: 6px 0 0; }
.warn { color: var(--warn); }
h3.subhead { margin: 18px 0 6px; color: var(--muted); font-size: 14px; text-transform: uppercase; letter-spacing: .04em; }
table.facts th { width: 11em; }
@media (max-width: 600px) { table.facts th { width: auto; } }
main { max-width: 940px; margin: 0 auto; padding: 20px 16px 48px; }
section.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 18px; box-shadow: var(--shadow); }
h2 { font-size: 17px; font-weight: 750; margin: 0 0 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
section.card > h2::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--grad); box-shadow: 0 0 8px color-mix(in srgb, var(--magenta) 45%, transparent); flex: none; }
h2 button.primary, h2 button.secondary, h2 button.danger { font-size: 13px; padding: 3px 12px; }
h3 { font-size: 14px; margin: 16px 0 8px; color: var(--muted); font-weight: 650; }
.badge { font-size: 12px; font-weight: 600; background: var(--badge); color: var(--muted); padding: 2px 10px; border-radius: 999px; }
.badge.ui { color: var(--accent); background: var(--ok-tint); }
.grid { display: grid; grid-template-columns: minmax(140px, 220px) 1fr; gap: 10px 14px; align-items: center; }
.grid label { color: var(--muted); }
input, select, textarea { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; width: 100%; transition: border-color .15s, box-shadow .15s; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent-2); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent-2) 22%, transparent); }
textarea { min-height: 60px; resize: vertical; }
input[type=checkbox] { width: auto; accent-color: var(--accent-2); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row > * { flex: 1 1 140px; }
button.primary, button.secondary, button.danger, a.button {
  font: inherit; font-weight: 600; border-radius: 999px; padding: 7px 16px; cursor: pointer; border: 1px solid var(--line);
  transition: transform .1s, box-shadow .15s, background .15s, filter .15s;
}
button.primary { background: linear-gradient(120deg, var(--accent-2), var(--accent)); color: var(--accent-text); border-color: transparent; box-shadow: 0 2px 8px color-mix(in srgb, var(--accent) 30%, transparent); }
button.primary:hover { filter: brightness(1.06); box-shadow: 0 4px 14px color-mix(in srgb, var(--accent) 35%, transparent); }
button.secondary, a.button { background: var(--panel); color: var(--text); }
button.secondary:hover, a.button:hover { background: var(--badge); }
button.danger { background: var(--panel); color: var(--warn); }
button.danger:hover { background: var(--rose-tint); border-color: color-mix(in srgb, var(--warn) 35%, var(--line)); }
button.danger.solid { background: var(--warn); color: #fff; border-color: transparent; }
button.danger.solid:hover { filter: brightness(1.06); background: var(--warn); }
button:active:not(:disabled) { transform: translateY(1px); }
button:disabled { opacity: .55; cursor: default; }
button:focus-visible, a.button:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent-2) 40%, transparent); outline-offset: 2px; }
.actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.guide h2 { font-size: 22px; margin-bottom: 8px; }
.guide h3 { font-size: 16px; color: var(--text); margin: 20px 0 6px; }
.guide h4 { font-size: 15px; margin: 14px 0 6px; }
.guide p, .guide li { line-height: 1.6; }
.guide ul { padding-left: 20px; }
.guide code { background: var(--badge); padding: 1px 6px; border-radius: 6px; font-size: 13px; }
.guide ol { padding-left: 22px; }
.guide figure { margin: 14px 0 18px; }
.guide figure img, .guide figure video { display: block; max-width: 100%; border-radius: 12px; border: 1px solid var(--line); box-shadow: var(--shadow); }
.guide figcaption { color: var(--muted); font-size: 13px; margin-top: 6px; }
/* Dialogs and hints in the guide: calm teal, so they do not look like an error. */
.guide aside.note { margin: 12px 0; padding: 10px 14px; border-radius: 12px; background: color-mix(in srgb, var(--accent) 9%, var(--panel)); border-left: 4px solid var(--accent-2); }
.guide pre.code { white-space: pre; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
.chip { display: inline-flex; align-items: center; gap: 4px; background: var(--ok-tint); border-radius: 999px; padding: 2px 4px 2px 12px; font-size: 13px; }
.chip small { color: var(--muted); }
.chip button { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 0 5px; font-size: 15px; border-radius: 999px; }
.chip button:hover { color: var(--warn); }
.item { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; background: var(--panel); transition: border-color .15s, box-shadow .15s; }
.item:hover { border-color: color-mix(in srgb, var(--magenta) 25%, var(--line)); }
details.item[open] { box-shadow: var(--shadow); }
h1 small.version { font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 2px; }
pre.code { background: var(--badge); padding: 10px; border-radius: 10px; overflow-x: auto; font-size: 12px; max-height: 300px; }
a.button { display: inline-block; text-decoration: none; }
label.checkline { display: inline-flex; gap: 6px; align-items: center; margin-bottom: 8px; }
label.checkline input { width: auto; }
.plan .step { display: flex; gap: 8px; align-items: baseline; margin: 4px 0; }
.plan .step input { width: auto; }
.plan .step.done { color: var(--muted); text-decoration: line-through; }
.plan .step.current { font-weight: 700; }
.plan h4 { margin: 12px 0 4px; }
.plan p { margin: 4px 0; }
details.item > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 1.4em var(--lead, 7.5em) minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; }
details.item > summary::-webkit-details-marker { display: none; }
details.item > summary::before { content: "▸"; color: var(--magenta); font-size: 1.5em; line-height: 1; transition: transform .15s; }
details.item[open] > summary::before { content: "▾"; }
details.item > summary .lead { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-width: 0; }
details.item > summary .short { min-width: 0; color: var(--muted); }
details.item > summary .short.clip { color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
details.item > summary h3 { margin: 0; overflow-wrap: anywhere; }
details.item.task > summary { --lead: 13em; }
@media (max-width: 600px) {
  details.item > summary { grid-template-columns: 1.4em minmax(0, 1fr) auto; }
  details.item > summary .short { grid-column: 2 / 4; }
}
.hint { color: var(--muted); font-size: 13px; margin: 4px 0 0; }
.msg { padding: 10px 14px; border-radius: 12px; margin-bottom: 12px; white-space: pre-wrap; border: 1px solid transparent; }
.msg.err { background: var(--rose-tint); color: var(--warn); border-color: color-mix(in srgb, var(--warn) 25%, transparent); }
.msg.ok { background: var(--ok-tint); color: var(--accent); border-color: color-mix(in srgb, var(--accent-2) 25%, transparent); }
table { width: 100%; border-collapse: collapse; }
td, th { text-align: left; padding: 8px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
th { color: var(--muted); font-weight: 600; font-size: 13px; }
pre { white-space: pre-wrap; margin: 0; font: inherit; }
p.empty { margin: 4px 0 0; font-size: 15px; }
details.profile { margin: 0 0 10px; }
details.profile > summary { cursor: pointer; color: var(--muted); font-weight: 600; font-size: 14px; }
details.profile pre { background: var(--badge); padding: 10px 12px; border-radius: 10px; margin-top: 8px; }
.runpre { background: var(--badge); padding: 8px 10px; border-radius: 8px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 18em; overflow: auto; font-size: 13px; }
td.fact-actions { white-space: nowrap; text-align: right; width: 1%; }
@media (max-width: 600px) { td.fact-actions { white-space: normal; } }
@media (max-width: 600px) { .grid { grid-template-columns: 1fr; } header { padding: 10px 16px; } }

/* Mira's own dialog instead of the browser's confirm/prompt. */
:is(dialog#dlg, dialog.mira-dialog) { border: 0; padding: 0; border-radius: 22px; width: min(420px, calc(100vw - 32px)); background: var(--panel); color: var(--text); box-shadow: 0 20px 60px rgb(60 20 50 / 25%); }
:is(dialog#dlg, dialog.mira-dialog)::backdrop { background: color-mix(in srgb, var(--ink) 35%, transparent); backdrop-filter: blur(3px); }
:is(dialog#dlg, dialog.mira-dialog)[open] { animation: pop .18s ease-out; }
:is(dialog#dlg, dialog.mira-dialog)[open]::backdrop { animation: fade .18s ease-out; }
:is(dialog#dlg, dialog.mira-dialog) form { padding: 22px 22px 18px; position: relative; }
:is(dialog#dlg, dialog.mira-dialog) form::before { content: ""; position: absolute; inset: 0 0 auto; height: 4px; background: var(--grad); }
.dlg-head { display: flex; gap: 14px; align-items: flex-start; }
.dlg-head img { width: 44px; height: 44px; flex: none; filter: drop-shadow(0 2px 6px color-mix(in srgb, var(--magenta) 35%, transparent)); }
#dlg-text { margin: 4px 0 0; font-size: 16px; line-height: 1.45; }
#dlg-input { margin-top: 14px; }
:is(dialog#dlg, dialog.mira-dialog) .actions { justify-content: flex-end; margin-top: 20px; }
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.97); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
dialog.mira-dialog { width: min(520px, calc(100vw - 32px)); }
:is(dialog#dlg, dialog.mira-dialog).wide { width: min(780px, calc(100vw - 32px)); max-height: calc(100vh - 48px); overflow: auto; }
dialog.mira-dialog h4 { margin: 18px 0 8px; }
dialog.mira-dialog .wide-label { display: block; color: var(--muted); margin: 12px 0 4px; }
dialog.mira-dialog textarea.code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
.actions .spacer { flex: 1; }
.actions.left { justify-content: flex-start; align-items: center; }
.restart-bar { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 12px 16px; margin-bottom: 14px; border-radius: 16px; background: var(--rose-tint); border: 1px solid color-mix(in srgb, var(--accent) 30%, var(--line)); }
.warn-box { background: var(--rose-tint); }
td.nowrap { white-space: nowrap; text-align: right; }
.item.pending { display: flex; gap: 10px; align-items: center; padding: 10px 14px; }
.item.pending .lead { flex: 1; }
.grid > input[type=checkbox] { justify-self: start; }
h2 > button.secondary { float: right; }
dialog.mira-dialog h3 { margin: 0 0 4px; }
.check-wait { display: flex; gap: 12px; align-items: center; margin-top: 10px; }
.spinner { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.check-result { margin-top: 10px; }
.check-result .big { font-size: 18px; font-weight: 700; }
.check-result .big.ok { color: var(--accent); }
.check-result .big.err { color: var(--warn); }
@media (prefers-reduced-motion: reduce) { :is(dialog#dlg, dialog.mira-dialog)[open], :is(dialog#dlg, dialog.mira-dialog)[open]::backdrop, .spinner { animation: none; } }
/* Inside Home Assistant: HA's theme (set from its variables, see haTheme),
   HA's toolbar instead of Mira's header, Mira's colors only as accents. */
html.ha body { font-family: var(--font); font-size: 14px; background: var(--bg); }
html.ha header { padding: 6px 16px; background: var(--bg); backdrop-filter: none; border-bottom: 1px solid var(--line); border-image: none; }
html.ha header h1, html.ha #lang { display: none; }
html.ha nav button.active { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
html.ha main { max-width: 1040px; padding-top: 16px; }
html.ha section.card { border: var(--card-border, 1px solid var(--line)); }
</style>
</head>
<body>
<header>
  <h1><img data-icon alt="">Mira <small class="version">%%VERSION%%</small></h1>
  <nav id="nav"></nav>
  <select id="lang" aria-label="Language" onchange="setLang(this.value)"><option value="de">Deutsch</option><option value="en">English</option></select>
</header>
<main id="main"></main>
<datalist id="entities"></datalist>
<dialog id="dlg">
  <form method="dialog">
    <div class="dlg-head"><img data-icon alt=""><p id="dlg-text"></p></div>
    <input id="dlg-input" autocomplete="off" hidden>
    <div class="actions"><button class="secondary" value="cancel" id="dlg-cancel"></button><button value="ok" id="dlg-ok"></button></div>
  </form>
</dialog>

// Inside Home Assistant the integration's sidebar panel shows this page

const HA_BASE = "/api/mira";

async function authorization() {

}
// haTheme copies HA's theme variables onto the page's own.
function haTheme() {
  let cs;
  try { cs = window.parent.getComputedStyle(window.parent.document.documentElement); } catch (e) { return; }
  const v = n => cs.getPropertyValue(n).trim();
  const st = document.documentElement.style;
  const set = (k, ...names) => { const x = names.map(v).find(Boolean); if (x) st.setProperty(k, x); };

  set("--panel", "--ha-card-background", "--card-background-color");
  set("--text", "--primary-text-color");
  set("--muted", "--secondary-text-color");
  set("--line", "--divider-color");
  set("--accent", "--primary-color");
  set("--accent-2", "--primary-color");
  set("--accent-text", "--text-primary-color");
  set("--warn", "--error-color");
  set("--badge", "--secondary-background-color");
  set("--radius", "--ha-card-border-radius");
  set("--shadow", "--ha-card-box-shadow");
  set("--font", "--ha-font-family-body", "--paper-font-body1_-_font-family");
  if (!v("--ha-card-box-shadow")) st.setProperty("--shadow", "none");
  const dark = !!(hass() && hass().themes && hass().themes.darkMode);

// When Mira cannot be reached (restarting, say), the page waits and tries
// again for a while, with a note in her words instead of a network error.
const RETRIES = 10, RETRY_WAIT = 3000;
async function api(method, path, body, tries = 0) {
  let res;
  try {
    res = await fetch(url(path), {
      method, headers: { "Authorization": await authorization(), "Content-Type": "application/json" },
      body: body === undefined ? undefined : JSON.stringify(body),
    });
  } catch (e) { res = null; }
  const data = res ? await res.json().catch(() => ({})) : {};
  if (!res || (res.status === 503 && data.unreachable)) {
    if (tries >= RETRIES) throw new Error(T.unreachable);
    message(T.unreachable, false);
    await new Promise(r => setTimeout(r, RETRY_WAIT));
    return api(method, path, body, tries + 1);
  }
  if (tries) { const box = $("#msg"); if (box) box.hidden = true; }
  if (res.status === 401 && !embedded) { askToken(); throw new Error(T.token_wrong); }
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

// ask shows Mira's dialog: true/false, or with input the text (null when
// cancelled). Escape and a click beside the dialog cancel.
function ask({ text, ok, danger, input }) {
  const d = $("#dlg"), inp = $("#dlg-input"), okb = $("#dlg-ok");
  if (d.open) return Promise.resolve(input ? null : false);
  $("#dlg-text").textContent = text;
  $("#dlg-cancel").textContent = T.dlg_cancel;
  okb.textContent = ok || T.dlg_ok;
  okb.className = danger ? "danger solid" : "primary";
  inp.hidden = !input; inp.type = input === "password" ? "password" : "text"; inp.value = "";
  d.returnValue = "";
  return new Promise(resolve => {
    d.onclose = () => {
      const yes = d.returnValue === "ok";
      resolve(input ? (yes ? inp.value.trim() : null) : yes);
    };
    d.showModal();
    (input ? inp : okb).focus();
  });
}
$("#dlg").addEventListener("click", e => { if (e.target === e.currentTarget) e.currentTarget.close(); });
// Enter in the field means OK, not the first button (cancel).
$("#dlg-input").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); $("#dlg").close("ok"); } });

// Several calls can fail with 401 at once; one question is enough.
let askingToken = false;
async function askToken() {
  if (askingToken) return;
  askingToken = true;
  const t = await ask({ text: T.token_ask, input: "password" });
  askingToken = false;
  if (t) { token = t; localStorage.setItem("mira.token", token); load(); }

function message(text, ok) {
  const box = $("#msg");
  if (!box) return;
  box.className = "msg " + (ok ? "ok" : "err");
  box.textContent = text;
  box.hidden = false;
  if (ok) setTimeout(() => { box.hidden = true; }, 3000);
}

async function save(sections) {
  try {
    config = await api("PUT", "/v1/ui/config", sections);
    message(T.saved, true);
    render();
  } catch (e) { message(e.message, false); }
}

async function reset(name) {
  if (!await ask({ text: T.reset_confirm, ok: T.reset_button })) return;
  try {
    config = await api("DELETE", "/v1/ui/config/" + name);
    message(T.reset_done, true);
    render();
  } catch (e) { message(e.message, false); }
}

function source(name) {
  const s = config[name];
  if (!s) return "";
  if (managed(name) && name !== "notifier")
    return `<span class="badge ui">${T.badge_ha}</span>`;
  return s.overridden
    ? `<span class="badge ui">${T.badge_ui}</span> <button class="secondary" onclick="reset('${name}')">${T.reset_button}</button>`
    : `<span class="badge">${T.badge_file}</span>`;
}

const val = name => (config[name] || {}).value;
const list = v => (Array.isArray(v) ? v : v ? [v] : []);
const csv = v => list(v).join(", ");
const fromCsv = s => s.split(",").map(x => x.trim()).filter(Boolean);
const lines = s => s.split("\n").map(x => x.trim()).filter(Boolean);
const num = (s, def) => (s === "" || s === undefined ? def : Number(s));
const opt = (value, current, label) => `<option value="${esc(value)}"${String(value) === String(current ?? "") ? " selected" : ""}>${esc(label ?? value)}</option>`;

function nav() {
  let el = $("#nav mira-nav");
  if (!el) { $("#nav").innerHTML = "<mira-nav></mira-nav>"; el = $("#nav mira-nav"); }
  el.tab = tab;
  if (el.requestUpdate) el.requestUpdate();
  $("#lang").value = lang;
}
function go(id) { tab = id; location.hash = id; render(); }

function render() {
  // The tabs that follow themselves stop when another view opens; otherwise
  // their next round would draw over it.
  clearTimeout(planTimer); clearTimeout(runTimer);
  nav();
  const views = { home, messages, tasks, plans, notifier, rooms, persons, memory, skills, agents, models, guide };
  $("#main").innerHTML = `<div id="msg" class="msg" hidden></div><div id="view"></div>`;
  views[tab]();
  const owner = { rooms: "satellites", persons: "persons" }[tab];
  if (owner && managed(owner) && !embedded) {
    $("#view").querySelectorAll("input, textarea, select, button").forEach(el => { el.disabled = true; });
    $("#view").querySelectorAll(".actions").forEach(el => { el.hidden = true; });
    $("#view").insertAdjacentHTML("afterbegin", `<p class="msg ok">${T.managed_hint}</p>`);
  }
}

  try {
    const r = await api("GET", `/v1/ui/messages?page=${messagePage}${openOnly ? "&open=1" : ""}`);
    const items = r.items || [];
    const pager = r.page > 0 || r.more ? `<div class="actions">

        <span class="hint">${T.page} ${r.page + 1}</span>

            <span class="badge${n.state === "pending" ? " ui" : ""}">${T["state_" + shownState(n.state)]}${n.state === "scheduled" && n.deliver_at ? " " + esc(n.deliver_at.slice(5)) : ""}</span></span>
          <span class="short clip">${esc(n.spoken)}</span>
          ${n.state === "pending" ? `<button class="secondary" onclick="event.preventDefault(); ack('${esc(n.id)}')">${T.done}</button>` : "<span></span>"}
        </summary>

      </details>`).join("") + pager;

// shownState folds delivered and done into one: for the user both mean

async function ack(id) {

      ${rows.map((r, i) => roomRow(r, i)).join("")}

function roomRow(r, i) {
  return `<tr data-r="${i}">
    <td><input data-f="area" value="${esc(r.area)}"></td>
    <td><input data-f="sat" list="entities" value="${esc(r.sat)}" placeholder="assist_satellite.…"></td>
    <td><input data-f="sensor" list="entities" value="${esc(r.sensor)}" placeholder="binary_sensor.…"></td>
    <td><input type="checkbox" data-f="active" ${r.active ? "checked" : ""}></td>
    <td><input data-f="ind" list="entities" value="${esc(r.ind)}" placeholder="light.…"></td>

function addRoom() {
  $("#rooms").insertAdjacentHTML("beforeend", roomRow({ area: "", sat: "", sensor: "", active: true, ind: "" }, Date.now()));
}
function saveRooms() {
  const sats = {}, presence = {}, areas = [], inds = {};
  document.querySelectorAll("[data-r]").forEach(tr => {
    const f = name => tr.querySelector(`[data-f="${name}"]`);
    const area = f("area").value.trim();
    if (!area) return;
    if (f("sat").value.trim()) sats[area] = f("sat").value.trim();
    if (f("sensor").value.trim()) presence[area] = fromCsv(f("sensor").value);
    if (f("active").checked) areas.push(area);
    if (f("ind").value.trim()) inds[area] = f("ind").value.trim();
  });
  const n = structuredClone(val("notifier") || {});
  n.morning_trigger = { areas, presence };
  delete n.room_mode;
  n.indicators = inds;
  save({ satellites: sats, notifier: n });
}

// Inside Home Assistant an admin edits Mira's settings on HA's persons and
// satellites right here; the integration checks them with the agent and
// stores them on the person or satellite (/api/mira/settings/…).
async function haApi(method, path, body) {
  const res = await fetch(path, {
    method, headers: { "Authorization": await authorization(), "Content-Type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}
async function haSettings(kind) {
  $("#view").innerHTML = `<section class="card">${T.loading}</section>`;
  let d;
  try { d = await haApi("GET", `${HA_BASE}/settings/${kind}`); } catch (e) { message(e.message, false); return; }
  const lists = (id, items) => `<datalist id="${id}">${items.map(c => typeof c === "string" ? `<option value="${esc(c)}">` : `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join("")}</datalist>`;
  const persons = kind === "persons";
  const head = persons
    ? `<th>${T.person}</th><th>${T.channels}</th><th>${T.accept_from}</th><th title="${T.alone_hint}">${T.alone_is_me}</th>`
    : `<th>${T.satellite}</th><th>${T.motion}</th><th>${T.announcements}</th><th>${T.indicator}</th>`;
  const row = it => {
    const s = it.settings || {}, sub = persons ? it.entity : `${esc(it.area)} · ${esc(it.entity)}`;
    const who = `<td>${esc(it.name)}<p class="hint">${persons ? esc(sub) : sub}</p></td>`;
    return `<tr data-e="${esc(it.entity)}">${who}` + (persons
      ? `<td><input data-f="channels" list="ha-notify" value="${esc(csv(s.channels))}" placeholder="notify.…"></td>
         <td>${acceptSelect(s.accept_from, "accept_from")}</td>
         <td><input type="checkbox" data-f="alone_is_me" title="${T.alone_hint}"${s.alone_is_me ? " checked" : ""}></td>`
      : `<td><input data-f="presence" list="ha-motion" value="${esc(csv(s.presence))}" placeholder="binary_sensor.…, …"></td>
         <td><input type="checkbox" data-f="morning"${s.morning ? " checked" : ""}></td>
         <td><input data-f="indicator" list="ha-lights" value="${esc(s.indicator || "")}" placeholder="light.…"></td>`) + `</tr>`;
  };
  $("#view").innerHTML = `
  <section class="card">
    <h2>${persons ? T.tab_persons : T.tab_rooms} <span class="badge ui">${T.badge_ha}</span></h2>
    <p class="hint">${persons ? T.persons_ha_hint : T.satellites_ha_hint}</p>
    <table>${`<tr>${head}</tr>`}${d.items.map(row).join("")}</table>
    ${persons ? lists("ha-notify", d.notify || []) : lists("ha-motion", d.binary_sensors || []) + lists("ha-lights", d.lights || [])}
    <div class="actions"><button class="primary" onclick="saveHASettings('${kind}')">${T.save}</button></div>
  </section>`;
}
async function saveHASettings(kind) {
  const out = {};
  document.querySelectorAll("#view tr[data-e]").forEach(tr => {
    const v = {};
    tr.querySelectorAll("[data-f]").forEach(el => { v[el.dataset.f] = el.type === "checkbox" ? el.checked : el.value.trim(); });
    if (kind === "satellites") v.presence = fromCsv(v.presence || "");
    if (kind === "persons") v.channels = fromCsv(v.channels || "");
    out[tr.dataset.e] = v;
  });
  try {
    await haApi("PUT", `${HA_BASE}/settings/${kind}`, out);
    message(T.saved, true);
    config = await api("GET", "/v1/ui/config");
  } catch (e) { message(e.message, false); }
}
// With the integration the satellites and Mira's settings on them come
// from Home Assistant; the page only shows them.

// With Home Assistant every HA person is a person; the page only sets
// Mira's settings for them.
function haPersons(people, settings) {

          <td>${esc(h.name)}<p class="hint">${esc(h.entity)}</p></td>

function addPerson() { $("#persons").insertAdjacentHTML("beforeend", personRow("", {}, Date.now())); }
function savePersons() {
  const out = {};
  document.querySelectorAll("[data-p]").forEach(tr => {
    const f = name => { const el = tr.querySelector(`[data-f="${name}"]`); return el ? el.value.trim() : ""; };
    const key = tr.dataset.key || f("key");
    if (!key) return;
    const p = {};
    if (f("entity")) p.entity = f("entity");
    if (f("channels")) p.channels = fromCsv(f("channels"));

// editFact turns the row into a text field; Enter saves, Escape cancels.
function editFact(id) {
  const row = document.querySelector(`tr[data-fact="${CSS.escape(id)}"]`);
  const cell = row.querySelector("td.fact"), text = row.querySelector(".text").textContent;
  cell.innerHTML = `<textarea rows="2">${esc(text)}</textarea>`;
  row.querySelector("td.fact-actions").innerHTML = `<button class="primary">${T.save}</button> <button class="secondary">${T.dlg_cancel}</button>`;
  const area = cell.querySelector("textarea"), [save, cancel] = row.querySelectorAll("td.fact-actions button");
  const store = async () => {
    const t = area.value.trim();
    if (!t || t === text) { memory(); return; }
    try { await api("PUT", "/v1/ui/memory/" + encodeURIComponent(id), { text: t }); memory(); } catch (e) { message(e.message, false); }
  };
  save.onclick = store;
  cancel.onclick = () => memory();
  area.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); store(); }
    if (e.key === "Escape") memory();
  });
  area.focus();
  area.setSelectionRange(area.value.length, area.value.length);
}
async function forget(id) {
  if (!await ask({ text: T.forget_confirm, ok: T.forget, danger: true })) return;
  try { await api("DELETE", "/v1/ui/memory/" + encodeURIComponent(id)); memory(); } catch (e) { message(e.message, false); }
}
async function compact() {
  $("#compact").disabled = true;
  $("#compact").textContent = T.compacting;
  try {
    const r = await api("POST", "/v1/ui/memory/compact");
    await memory();
    message(r.changed ? T.profile_updated : T.profile_unchanged, true);
  } catch (e) { message(e.message, false); memory(); }
}

// The stored agent runs, read-only (docs/spec/agenten.md, Run view). The
// list follows by itself while no run is opened.
let runTimer = null;
async function agents() {
  clearTimeout(runTimer);
  if (tab !== "agents") return;
  if (!$("#runlist")) {
    $("#view").innerHTML = `<mira-agent-defs></mira-agent-defs><section class="card"><h2>${T.runs_title}</h2><p class="hint">${T.agents_hint}</p><div id="runlist">${T.loading}</div></section>`;
  }
  if (!document.querySelector("#runlist details[open]")) {
    try {
      const list = (await api("GET", "/v1/ui/agents")).runs || [];
      $("#runlist").innerHTML = list.length === 0 ? `<p class="hint">${T.no_runs}</p>` : list.map(r => `
        <details class="item run" ontoggle="if (this.open) runDetail(this, '${esc(r.call_id)}')">
          <summary>
            <span class="lead"><h3>${esc(r.agent)}</h3><span class="badge${r.status === "running" ? " ui" : ""}">${esc(r.status)}</span></span>
            <span class="short">${esc(r.started)}${r.ended ? "–" + esc(r.ended) : ""} · ${(r.duration_ms / 1000).toFixed(1)} s${r.model ? ` · ${esc(r.model)} · ${r.model_calls} ${T.run_calls} · ${r.prompt_tokens + r.completion_tokens} ${T.run_tokens}` : ""}${r.route ? ` · ${esc(r.route)}` : ""}</span>
            <span class="short">${r.parent_id ? `${T.run_from} ${esc(r.parent_id)}` : ""}</span>
          </summary>
          <div class="rundetail">${T.loading}</div>
        </details>`).join("");
    } catch (e) { message(e.message, false); }
  }
  if (tab === "agents") runTimer = setTimeout(agents, 10000);
}
// runDetail shows one run: its call, input, every stored step, the output.
async function runDetail(el, id) {
  const box = el.querySelector(".rundetail");
  try {
    const d = await api("GET", "/v1/ui/agents/" + encodeURIComponent(id));
    const c = d.call || {};
    const pre = text => `<pre class="runpre">${esc(text)}</pre>`;
    const step = s => {
      const b = s.body || {};
      switch (s.kind) {
        case "answer": return `<p><b>${T.run_model}:</b> ${esc(b.content || "")}</p>` +
          (b.tool_calls || []).map(tc => `<p>→ <code>${esc(tc.function.name)}</code></p>${pre(tc.function.arguments || "{}")}`).join("");
        case "started": return `<p class="hint">▶ <code>${esc(b.name)}</code> ${T.run_started}</p>`;
        case "result": return `<p><b>${T.run_result} <code>${esc(b.name)}</code>:</b></p>${pre(b.content || "")}`;
        case "state": return `<p class="hint">${T.run_state}: ${[b.web ? T.run_web : "", b.foreign ? T.run_foreign : ""].filter(Boolean).join(", ")}</p>`;
      }
      return pre(JSON.stringify(b, null, 2));
    };
    box.innerHTML = `
      <p class="hint"><b>${T.run_call}:</b> ${esc(d.call_id)} · ${esc(c.origin || "")} · ${esc(c.mode || "")}${c.delivery ? " → " + esc(c.delivery) : ""}${c.thread ? ` (${esc(c.thread)} / ${esc(c.into)})` : ""} · ${esc(c.rights || "")} · depth ${c.depth}${c.person ? " · " + esc(c.person) : ""}${c.place ? " · " + esc(c.place) : ""}${d.foreign ? " · " + T.run_foreign : ""}</p>
      <p><b>${T.run_input}:</b></p>${pre(d.input || "")}
      ${(d.steps || []).map(step).join("")}
      ${d.output ? `<p><b>${T.run_output}:</b></p>${pre(d.output)}` : ""}
      ${d.error ? `<p><b>${T.run_error}:</b> ${esc(d.error)}</p>` : ""}`;
  } catch (e) { box.textContent = e.message; }
}

// The running plans, read-only; the tab follows them by itself.
let planTimer = null;
async function plans() {
  clearTimeout(planTimer);
  if (tab !== "plans") return;
  if (!$("#planlist")) {
    $("#view").innerHTML = `<section class="card"><h2>${T.tab_plans}</h2><p class="hint">${T.plans_hint}</p><div id="planlist">${T.loading}</div></section>`;
  }
  try {
    const r = await api("GET", "/v1/ui/plans");
    const list = r.plans || [];
    $("#planlist").innerHTML = list.length === 0 ? `<p class="hint">${T.no_plans}</p>` : list.map(p => `
      <div class="item plan">
        <h3>${esc(p.request || p.target)}</h3>
        <p class="hint">${p.place ? `<span class="badge">${esc(p.place)}</span> ` : ""}${p.steps ? `${p.done}/${p.steps} ${T.plan_steps} · ` : ""}${T.plan_since} ${esc(p.started)}${p.finished ? ` · <span class="badge ui">${T.plan_finished}</span>` : ""}</p>
        ${planHtml(p.plan)}
      </div>`).join("");
  } catch (e) { message(e.message, false); }
  if (tab === "plans") planTimer = setTimeout(plans, 10000);
}
// planHtml shows a plan's Markdown: checkboxes as steps (the first open one
// is the current), headings, the rest as lines.
function planHtml(md) {
  let current = false;
  return String(md || "").split("\n").map(line => {
    const box = line.match(/^\s*[-*+]\s+\[([ xX])\]\s*(.*)$/);
    if (box) {
      const done = box[1] !== " ";
      const cls = done ? " done" : current ? "" : " current";
      if (!done) current = true;
      return `<div class="step${cls}"><input type="checkbox" disabled${done ? " checked" : ""}><span>${esc(box[2])}</span></div>`;
    }
    const head = line.match(/^#{1,6}\s+(.*)$/);
    if (head) return `<h4>${esc(head[1])}</h4>`;
    return line.trim() ? `<p>${esc(line.replace(/^\s*[-*+]\s+/, "• "))}</p>` : "";
  }).join("");
}

async function tasks() {
  $("#view").innerHTML = `<section class="card"><h2>${T.tab_tasks}</h2><p class="hint">${T.tasks_hint}</p><div id="tasklist">${T.loading}</div></section>`;
  try {
    const r = await api("GET", "/v1/ui/tasks");
    const list = r.items || [];
    const warn = r.error ? `<p class="msg err">${T.tasks_ha_error}: ${esc(r.error)}</p>` : "";
    // Tasks still being planned: open threads, with what Mira said last.
    const planning = (r.planning || []).map(p => `
      <details class="item task">
        <summary>
          <span class="lead"><h3>${esc(p.request)}</h3>
            <span class="badge ui">${T["thread_" + p.state] || p.state}</span></span>
          <span class="short">${esc(p.last || "")}</span>
          ${p.state === "proposed" ? `<button class="primary" onclick="event.preventDefault(); setTask('${esc(p.id)}', 'activate')">${T.task_create}</button>` : "<span></span>"}
        </summary>
        <p class="hint">${esc(p.updated)}</p>
        <div class="actions"><button class="danger" onclick="setTask('${esc(p.id)}', 'pause')">${T.thread_cancel}</button></div>
      </details>`).join("");
    $("#tasklist").innerHTML = warn + planning + (list.length === 0 && !planning ? `<p class="hint">${T.no_tasks}</p>` : list.map(t => {
      const id = esc(t.id);
      const button = t.state === "proposed"
        ? `<button class="primary" onclick="event.preventDefault(); setTask('${id}', 'activate')">${T.task_create}</button>`
        : t.state === "on"
          ? `<button class="secondary" onclick="event.preventDefault(); setTask('${id}', 'pause')">${T.task_pause}</button>`
          : `<button class="primary" onclick="event.preventDefault(); setTask('${id}', 'activate')">${T.task_resume}</button>`;
      return `
      <details class="item task" ontoggle="if (this.open) taskLog('${id}')">
        <summary>
          <span class="lead"><h3>${esc(t.title)}</h3>
            <span class="badge${t.state === "on" ? " ui" : ""}">${T["task_" + t.state] || t.state}</span></span>
          <span class="short">${esc(t.goal)}${t.last_triggered ? ` · ${T.task_last}: ${esc(localTime(t.last_triggered))}` : ""}</span>
          ${button}
        </summary>
        ${t.summary ? `<p>${esc(t.summary)}</p>` : ""}
        <pre class="code">${esc(JSON.stringify(t.automation, null, 2))}</pre>
        <div class="actions">
          ${t.edit_url ? `<a class="button secondary" href="${esc(haLink(t.edit_url))}" target="${haTarget}" rel="noopener"${embedded ? " data-ha" : ""}>${T.task_edit}</a>` : ""}
          <button class="secondary" onclick="tryTask('${id}')">${T.task_try}</button>
          <button class="danger" onclick="deleteTask('${id}')">${T.remove}</button>
        </div>
        <p class="msg ok" id="try-${id}" hidden></p>
        <h4>${T.task_log}</h4>
        <div id="log-${id}" class="hint">${T.loading}</div>
      </details>`;
    }).join(""));
  } catch (e) { message(e.message, false); }
}
// localTime shows an ISO time from Home Assistant (UTC) in local time.
function localTime(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  const p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
async function taskLog(id) {
  const el = document.getElementById("log-" + id);
  try {
    const log = await api("GET", `/v1/ui/tasks/${encodeURIComponent(id)}/log`);
    el.innerHTML = log.length === 0 ? T.task_log_empty : `<ul>${log.map(a => `<li><b>${esc(a.at)}</b> · ${
      a.kind === "decide" ? `${T.task_answer} ${a.answer ? T.yes : T.no}` : a.kind === "message" ? T.task_fixed : `${T.importance} ${a.importance}`}${
      a.notified ? ` · ${T.task_notified}` : ""}${a.dry_run ? ` · ${T.task_dry}` : ""}<br>${esc(a.spoken)}${
      a.input ? `<br><small>${esc(a.input)}</small>` : ""}</li>`).join("")}</ul>`;
  } catch (e) { el.textContent = e.message; }
}
async function tryTask(id) {
  const el = document.getElementById("try-" + id);
  el.hidden = false; el.textContent = T.task_trying;
  try { const r = await api("POST", `/v1/ui/tasks/${encodeURIComponent(id)}/try`); el.textContent = r.text; taskLog(id); }
  catch (e) { el.textContent = e.message; }
}
async function setTask(id, action) {
  try { await api("POST", `/v1/ui/tasks/${encodeURIComponent(id)}/${action}`); tasks(); } catch (e) { message(e.message, false); }
}
async function deleteTask(id) {
  if (!await ask({ text: T.task_delete_confirm, ok: T.remove, danger: true })) return;
  try { await api("DELETE", `/v1/ui/tasks/${encodeURIComponent(id)}`); tasks(); } catch (e) { message(e.message, false); }
}

// ---- Anleitung ----------------------------------------------------------
// The guide is Markdown from docs/guide/; this renders the little it uses:
// headings, lists, tables, paragraphs, bold, code and links.
// guideChapter is the chapter the guide opens at (a link on the start page).
let guideChapter = null;
function openChapter(n) { guideChapter = n; go("guide"); }
async function guide() {
  $("#view").innerHTML = `<section class="card guide" id="guide">${T.loading}</section>`;
  try {
    const res = await fetch(url("/ui/guide/" + lang));
    $("#guide").innerHTML = markdown(await res.text());
    if (guideChapter !== null) {
      const h = document.getElementById("chapter-" + guideChapter);
      guideChapter = null;
      if (h) h.scrollIntoView({ block: "start" });
    }
  } catch (e) { message(e.message, false); }
}
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*\w])\*([^*\s][^*]*)\*(?!\*)/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function markdown(md) {
  const out = [];
  let chapter = 0;
  let list = null, table = null, para = [], code = null, quote = [];
  const flush = () => {
    if (para.length) { out.push(`<p>${inline(para.join(" "))}</p>`); para = []; }
    if (list) { out.push(`</${list}>`); list = null; }
    if (quote.length) {
      // An empty quote line separates paragraphs, like the lines of a dialog.
      const paras = quote.join("\n").split(/\n\s*\n/).map(p => inline(p.replace(/\n/g, " ")));
      out.push(`<aside class="note">${paras.join("<br>")}</aside>`);
      quote = [];
    }
    if (table) {
      const [head, ...rows] = table.filter(r => !/^\|[\s:|-]+\|$/.test(r));
      const cells = r => r.replace(/^\||\|$/g, "").split("|").map(c => inline(c.trim()));
      out.push(`<table><tr>${cells(head).map(c => `<th>${c}</th>`).join("")}</tr>${rows.map(r => `<tr>${cells(r).map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</table>`);
      table = null;
    }
  };
  const item = (kind, text) => {
    if (list !== kind) { flush(); out.push(`<${kind}>`); list = kind; }
    out.push(`<li>${inline(text)}</li>`);
  };
  for (const raw of md.split("\n")) {
    const line = raw.trimEnd();
    let m;
    if (code !== null) {
      if (line.startsWith("```")) { out.push(`<pre class="code">${esc(code.join("\n"))}</pre>`); code = null; } else code.push(raw);
      continue;
    }
    if (line.startsWith("```")) { flush(); code = []; continue; }
    if (!line.trim()) { flush(); continue; }
    if ((m = line.match(/^(#{1,3})\s+(.*)/))) {
      flush(); const n = m[1].length + 1;
      // A chapter (##) gets an id by its order, for links from the start page.
      const id = m[1] === "##" ? ` id="chapter-${chapter++}"` : "";
      out.push(`<h${n}${id}>${inline(m[2])}</h${n}>`); continue;
    }
    // A recording is "▶ [caption](https://….mp4#t=start,end)": a plain link on GitHub, a player here.
    if ((m = line.match(/^▶\s+\[([^\]]*)\]\((https:\/\/[^\s)]+\.(?:mp4|webm)(?:#t=[\d:.,]+)?)\)$/))) { flush(); out.push(media(m[1], m[2])); continue; }
    if ((m = line.match(/^!\[([^\]]*)\]\((img\/[\w.-]+|https:\/\/[^\s)]+\.(?:mp4|webm)(?:#t=[\d:.,]+)?)\)$/))) { flush(); out.push(media(m[1], m[2])); continue; }
    if ((m = line.match(/^>\s?(.*)/))) { if (!quote.length) flush(); quote.push(m[1]); continue; }
    if (line.startsWith("|")) { if (!table) { flush(); table = []; } table.push(line); continue; }
    if ((m = line.match(/^\s*[-*]\s+(.*)/))) { item("ul", m[1]); continue; }
    if ((m = line.match(/^\s*\d+\.\s+(.*)/))) { item("ol", m[1]); continue; }
    if (list || quote.length) flush();
    para.push(line.trim());
  }
  flush();
  return out.join("\n");
}
// media shows a picture or a recording of the guide with its caption.
// Pictures come with the agent; recordings live on their own server
// (docs/guide/img/README.md), fetched without a referer (meta above).
// A recording may end in #t=start or #t=start,end (seconds or mm:ss) to start
// at a point of one long video and stop at the end of its part.
function media(alt, src) {
  const file = src.startsWith("https://") ? src : url("/ui/guide/" + src);
  const body = /\.(mp4|webm)(#t=[\d:.,]+)?$/.test(src)
    ? `<video controls playsinline preload="metadata" src="${esc(file)}"></video>`
    : `<a href="${esc(file)}" target="_blank" rel="noopener"><img src="${esc(file)}" alt="${esc(alt)}" loading="lazy"></a>`;
  return `<figure>${body}${alt ? `<figcaption>${inline(alt)}</figcaption>` : ""}</figure>`;
}

async function load() {
  // Without a stored token the first call answers 401 and asks for one;
  // an agent without server.token needs none.
  if (!isAdmin) { render(); return; }
  try {
    config = await api("GET", "/v1/ui/config");
    render();
    const ents = await api("GET", "/v1/ui/entities");
    entityNames = Object.fromEntries((ents || []).map(e => [e.id, [e.name, e.area].filter(Boolean).join(" · ")]));
    $("#entities").innerHTML = (ents || []).map(e => `<option value="${esc(e.id)}">${esc([e.name, e.area].filter(Boolean).join(" · "))}</option>`).join("");
  } catch (e) { render(); message(e.message, false); }
}

{
