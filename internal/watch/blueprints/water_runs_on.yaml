blueprint:
  name: "Mira: water runs on"
  description: >-
    Tells Mira when the water meter runs without a pause for a while: it counts as running while it changed
    within the gap, and Mira gets an entry once it has run for the duration (once per streak). Brought and
    updated by the Mira service; a change made here is overwritten. mira-version: 1
  domain: automation
  author: Mira
  input:
    meter:
      name: Water meter
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: water
    gap:
      name: Gap
      description: The meter counts as running while it changed within this many minutes (a meter that reports every 5 minutes needs more than 10).
      default: 11
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: min
          mode: box
    duration:
      name: Duration
      description: How many minutes the water runs without a pause before Mira is told.
      default: 30
      selector:
        number:
          min: 5
          max: 1440
          unit_of_measurement: min
          mode: box
    message:
      name: Entry
      description: The entry Mira gets; the Mira service fills it in the house's language.
      default: "At {{ now().strftime('%H:%M') }} water had run for {{ duration }} minutes without a pause. Meter: {{ states(meter) }} {{ state_attr(meter, 'unit_of_measurement') }}."
      selector:
        text:
          multiline: true

mode: single

trigger_variables:
  meter: !input meter
  gap: !input gap

variables:
  meter: !input meter
  duration: !input duration

triggers:
  - trigger: template
    value_template: >-
      {% set s = states[meter] %}
      {{ s is not none and (now() - s.last_changed).total_seconds() < gap * 60 }}
    for:
      minutes: !input duration

actions:
  - action: mira.send_message
    data:
      text: !input message
      importance: 2
      receiver: house
      dedupe_key: "watch:{{ this.attributes.id }}"
      expires_in: 12h
      task: "{{ this.attributes.id }}"
