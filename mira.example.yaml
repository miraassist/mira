# Mira — example configuration. The file is optional: without it the Home
# Assistant integration sets Mira up (pairing code, Home Assistant access,
# language model; docs/guide/en.md, "Setup"). Use it for what goes beyond:
# more models and routing, more MCP servers, skills with settings.
# What the integration sets wins over server.token, ha, llm and the "ha"
# MCP server here; leave those out when you pair.
# Copy to mira.yaml and adjust.
# Secrets are never written here: ${NAME} is read from the environment.
# Check a config and all dependencies with:  mira -config mira.yaml check

server:
  # Bind to the internal network only; the HA integration is the only client.
  listen: "0.0.0.0:8787"
  token: ${MIRA_API_TOKEN}
  # Announce by mDNS (_mira._tcp) so Home Assistant finds the agent. Only the
  # LAN interfaces are announced, never container bridges.
  announce: true
  name: Mira

# The language models by name (docs/spec/modelle.md). main must exist: every
# agent that names no model takes it. Settings a model leaves out come from
# main, except cache_prompt, warmups and pin_slots (each model's own).
models:
  main:
    endpoint: "http://localhost:8080/v1"   # llama.cpp server
    model: "local"
    privacy: local         # local: the data stays in the house; cloud: it leaves it
    parallel: 1            # requests at once; without it local 1, cloud 4
    # One llama.cpp slot per channel keeps each channel's prompt cache warm.
    # Start llama-server with at least --parallel 3; leave it out for servers
    # without id_slot (LM Studio, vLLM, OpenAI).
    pin_slots: { voice: 0, telegram: 1, background: 2 }
    cache_prompt: true     # llama.cpp and LM Studio only
    max_tool_rounds: 8
    temperature: 0.3
    max_tokens: 1024
    timeout: 2m
    context_tokens: 16384  # per slot: llama-server --ctx-size divided by --parallel
    warmup_on_start: true
    warmup_on_prefix_change: true
  smart:
    endpoint: "https://generativelanguage.googleapis.com/v1beta/openai"
    token: ${GEMINI_API_TOKEN}
    model: "gemini-flash-latest"
    privacy: cloud
    reasoning_effort: low    # thinking costs time and money
    context_tokens: 200000
    fallback: main           # taken when smart fails
  lite:
    endpoint: "https://generativelanguage.googleapis.com/v1beta/openai"
    token: ${GEMINI_API_TOKEN}
    model: "gemini-flash-lite-latest"
    privacy: cloud
    reasoning_effort: low
    context_tokens: 200000

# store.path defaults to mira.db in $MIRA_DATA (/var/lib/mira in the image).
# store:
#   path: "/var/lib/mira/mira.db"

# Mira speaks the language spoken to her (docs/spec/sprache.md); there is
# no setting for it.
prompt:
  # Static text appended to the system prompt. Part of the cached prefix,
  # so nothing in here may change between requests.
  persona: ""

ha:
  url: "http://homeassistant.local:8123"
  token: ${HA_TOKEN}          # long-lived token of a dedicated HA user
  structure_debounce: 30s

mcp_servers:
  - name: ha
    transport: http
    url: "http://homeassistant.local:8123/api/mcp"
    token: ${HA_TOKEN}
  # Mira has her own web search (web_search below); a search of your own
  # runs as an MCP server like this one, with the built-in switched off.
  - name: search
    transport: http
    url: "http://localhost:9100/mcp"
    disabled: true
    read_only: true
    # Results are untrusted web text: using this server locks critical
    # actions (locks, alarm, garage) for the rest of the turn.
    web_content: true

# Mira's own web search (docs/spec/websuche.md): DuckDuckGo, no key. The
# integration's options ("General" → "Web search") win over this.
web_search:
  enabled: true

# Who speaks at a satellite, by the voice (docs/spec/sprecher.md): the
# speaker-id service (services/speaker-id) in front of the STT. Without a
# URL the satellites are anonymous unless the "alone at home" rule names
# someone.
# speaker_id:
#   url: http://192.168.x.y:10311
#   token: ${SPEAKER_ID_TOKEN}  # the service's SPEAKER_TOKEN
#   threshold: 0.7          # the score a voice needs; a person's
#                           # voice_threshold (under persons) wins

# Telegram runs through Home Assistant's own Telegram integration
# (telegram_bot); Mira has no bot of her own (docs/spec/kanaele.md).

# What the model sees of a conversation (docs/spec/kontext.md): the running
# thread plus the last turns. At max_turns the history is cut to keep_turns,
# and at llm.compact_at_fraction (0.9) of the context window as well.
sessions:
  voice_ttl: 5m
  telegram_ttl: 0      # 0: no time limit, max_turns bounds it
  max_turns: 50
  keep_turns: 30

satellites:            # area id -> satellite that speaks announcements there
  bad: assist_satellite.bad
  kueche: assist_satellite.kueche
  # A satellite that is only a media_player works too (needs notifier.tts_entity):
  # wohnzimmer: media_player.echo_wohnzimmer

# Every HA person is a person for Mira, keyed by the HA person's id; here
# go only Mira's settings for a person (with the integration they are set
# in Home Assistant instead).
persons:
  ben:                                    # the HA person's id
    channels:                             # notify targets, first that works
      - notify.telegram_ben               # a chat of HA's Telegram integration
      - notify.mobile_app_phone           # the companion app
    accept_from: all                      # all | persons | none
    alone_is_me: false                    # alone at home, the satellites are ben

# Tasks ("Achte auf den Wasserverbrauch") are Home Assistant automations
# with the label "Mira" that call mira.assess, mira.decide or
# mira.send_message; create them in conversation or in Home Assistant
# (docs/spec/aufgaben.md).

notifier:
  quiet_hours: { from: "22:30", to: "06:30" }
  # Announcements happen on motion in these areas: the first motion after
  # quiet hours is the morning announcement.
  morning_trigger:
    areas: [bad, kueche]
    presence:
      bad: binary_sensor.bad_motion
      kueche: binary_sensor.kueche_motion
  cooldown: 30m
  max_items_per_announcement: 3
  min_importance: 1
  follow_up_window: 2m
  # A message left at a satellite does not wait in that same room for this
  # long (whoever left it is standing there); other rooms get it at once.
  # 0 turns it off. Also set in the HA options (General).
  own_message_hold: 10m
  # Important messages nobody heard by this time go out privately.
  escalate_to_telegram: { min_importance: 2, after: "09:00", grace: 30m }
  # Urgent messages (water leak, smoke) go out at once, even in quiet hours:
  # privately to everyone and, unless confidential, on every satellite.
  urgent: { min_importance: 3, announce: true }
  # When may a confidential message be spoken? never | when_alone | always
  # when_alone: only its recipient (by the person entities) is home.
  confidential_voice: when_alone
  # auto: start_conversation if the satellite supports it, else announce.
  delivery: auto
  # tts_entity: tts.piper
  # An indicator light per room glows while messages wait ("Hast du eine
  # Benachrichtigung?" reads them); announcing on entry is morning_trigger.
  # indicators: { wohnzimmer: light.wohnzimmer_ring_led_ring }   # e.g. an Echo's LED ring (echolocal)
  # indicator: { rgb_color: [32, 201, 176], effect: Pulse, brightness: 160 }   # teal from the logo

# What needs a yes is decided by hooks (docs/spec/hooks.md): the default
# critical.star asks for locks, alarm panels and everything with the label
# "Mira: nachfragen" in Home Assistant (e.g. the garage door). Hooks of your
# own go into the folder hooks/ next to this file.
security:
  confirm_ttl: 5m          # how long a question waits for the yes
  # Tools that only read, for servers that do not annotate their tools.
  # Only read-only tools are offered to background jobs.
  read_only_tools: [ha__GetDateTime, ha__GetLiveContext, ha__HassGetWeather, ha__todo_get_items]

memory:
  profile_schedule: "30 3 * * *"   # nightly: facts -> compact profile (prompt layer 5)
  max_facts_in_layer: 8
  max_profile_chars: 2000

telemetry:
  otlp_endpoint: "localhost:4317"   # empty disables export
  service_name: mira
  capture_content: false            # prompts are private household data
  log_level: info

# Agents: how deep agents may call each other, and agents described in YAML
# (docs/spec/agenten.md, Factory). Call them from automations with mira.agent.
# Every agent takes main unless it names its model here (Mira's own agents
# take only model and privacy). delegate is the model the conversation hands
# harder tasks to; mail.read and mail.match read the mails of the mail
# calendars, so a local model keeps them in the house.
agents:
  max_depth: 3
  skill.task: { model: lite }
  notify.compose: { model: lite }
  tasks.assess: { model: lite }
  tasks.decide: { model: lite }
  profile.compact: { model: lite }
  delegate: { model: smart }
  tasks.plan: { model: smart }
  # mail.read: { model: main, privacy: local }
  # recipe:
  #   description: Turns a recipe page into a list of steps.
  #   context: background          # isolated (the default) or background
  #   tools: [web_page]            # none (the default), read_only or a list
  #   rights: [read_house, web]    # the default is read_house
  #   input: { type: object, properties: { url: { type: string } } }
  #   instructions: You get the address of a recipe page; return the steps as a list.

# Skills: folders with a SKILL.md (Agent Skills format) in skills.dirs.
# Beside dirs, each key is a skill with its settings; it is on unless it says
# enabled: false (Mira's own skills, such as kochen, are on without a line).
# A skill costs one line in the prompt until Mira opens it; secret settings
# never reach a model.
skills:
  dirs: [skills]
  abfall:
    calendar: calendar.abfuhrtermine   # the waste calendar in Home Assistant, exposed to Assist
    types: [Restabfall, Wertstoff]
  briefing:                            # morning and evening briefing, also on request
    kalender: Familie                  # the house's calendars; empty = all exposed, personal ones too
    themen: Deutschland                # news topics for the morning; empty = no news
