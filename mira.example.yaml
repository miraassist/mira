# Mira — example configuration. Copy to mira.yaml and adjust.
# Secrets are never written here: ${NAME} is read from the environment.
# Check a config and all dependencies with:  mira -config mira.yaml check

server:
  # Bind to the internal network only; the HA integration is the only client.
  listen: "0.0.0.0:8787"
  token: ${MIRA_API_TOKEN}
  # Announce by mDNS (_mira._tcp) so Home Assistant finds the agent. Only the
  # LAN interfaces are announced, never container bridges.
  announce: true
  name: Mira

llm:
  base_url: "http://localhost:8080/v1"   # llama.cpp server
  model: "local"
  # One llama.cpp slot per channel keeps each channel's prompt cache warm.
  # Start llama-server with at least --parallel 3.
  slots: { voice: 0, telegram: 1, background: 2 }
  slot_pinning: true     # set false for servers without id_slot (LM Studio, vLLM, OpenAI)
  cache_prompt: true
  max_tool_rounds: 8
  temperature: 0.3
  max_tokens: 1024
  timeout: 2m
  context_tokens: 16384  # per slot: llama-server --ctx-size divided by --parallel
  warmup_on_start: true
  warmup_on_prefix_change: true

# Further models by name; the one above is "main". Settings they leave out
# come from main, except slots, cache_prompt and warmups (local only).
# Without a local model, point llm itself at a cloud endpoint instead.
models:
  smart:
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
    api_key: ${GEMINI_API_TOKEN}
    model: "gemini-flash-latest"
    reasoning_effort: low    # thinking costs time and money
    context_tokens: 200000
  lite:
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
    api_key: ${GEMINI_API_TOKEN}
    model: "gemini-flash-lite-latest"
    reasoning_effort: low
    context_tokens: 200000

# Which model serves what; empty is main. delegate gives the voice and
# Telegram model a tool to hand harder tasks to a stronger model, which may
# look things up but changes nothing. Leave it empty to turn the tool off.
routing:
  voice: main
  telegram: main
  background: lite
  delegate: smart
  tasks: smart        # plans standing orders; empty is background

store:
  path: "/var/lib/mira/mira.db"

prompt:
  language: de   # de or en: prompts, notices and replies; Mira still answers in the language spoken to her
  # Static text appended to the system prompt. Part of the cached prefix,
  # so nothing in here may change between requests.
  persona: ""

ha:
  enabled: true
  url: "http://homeassistant.local:8123"
  token: ${HA_TOKEN}          # long-lived token of a dedicated HA user
  structure_debounce: 30s

mcp_servers:
  - name: ha
    transport: http
    url: "http://homeassistant.local:8123/api/mcp"
    token: ${HA_TOKEN}
  - name: search
    transport: http
    url: "http://localhost:9100/mcp"
    read_only: true
    # Results are untrusted web text: using this server locks critical
    # actions (locks, alarm, garage) for the rest of the turn.
    web_content: true

telegram:
  enabled: true
  token: ${TELEGRAM_TOKEN}
  allowed_user_ids: [123456789]   # your numeric Telegram user id

sessions:
  voice_ttl: 5m
  telegram_ttl: 12h

satellites:            # area id -> satellite that speaks announcements there
  bad: assist_satellite.bad
  kueche: assist_satellite.kueche
  # A satellite that is only a media_player works too (needs notifier.tts_entity):
  # wohnzimmer: media_player.echo_wohnzimmer

persons:               # key = audience id for personal notices
  stefan:
    entity: person.stefan                 # home/not_home, used by confidential_voice
    telegram_user_id: 123456789           # must be on telegram.allowed_user_ids
    notify: notify.mobile_app_pixel       # companion app, optional

# Tasks ("Achte auf den Wasserverbrauch") are Home Assistant automations
# with the label "Mira" that call mira.assess, mira.decide or
# mira.add_notice; create them in conversation or in Home Assistant
# (docs/spec/aufgaben.md).

notifier:
  quiet_hours: { from: "22:30", to: "06:30" }
  # Announcements happen on motion in these areas: the first motion after
  # quiet hours is the morning announcement.
  morning_trigger:
    areas: [bad, kueche]
    presence:
      bad: binary_sensor.bad_motion
      kueche: binary_sensor.kueche_motion
  cooldown: 30m
  max_items_per_announcement: 3
  min_importance: 1
  follow_up_window: 2m
  # Important notices nobody heard by this time go out privately.
  escalate_to_telegram: { min_importance: 2, after: "09:00", grace: 30m }
  # Urgent notices (water leak, smoke) go out at once, even in quiet hours:
  # privately to everyone and, unless confidential, on every satellite.
  urgent: { min_importance: 3, announce: true }
  # When may a confidential notice be spoken? never | when_alone | always
  # when_alone: only its recipient (by the person entities) is home.
  confidential_voice: when_alone
  private_via: [telegram, push]
  # auto: start_conversation if the satellite supports it, else announce.
  delivery: auto
  # tts_entity: tts.piper
  # Per room: "announce" (default) speaks notices when someone comes in;
  # "indicate" only lights the room's indicator, and you ask "Hast du eine
  # Benachrichtigung?". Urgent notices and reminders are spoken anyway.
  # room_mode: { wohnzimmer: indicate }
  # indicators: { wohnzimmer: light.wohnzimmer_ring_led_ring }   # e.g. an Echo's LED ring (echolocal)
  # indicator: { rgb_color: [32, 201, 176], effect: Pulse, brightness: 160 }   # teal from the logo

security:
  confirm_domains: [lock, alarm_control_panel]
  confirm_entities: [cover.garage]
  confirm_ttl: 5m
  # Tools that only read, for servers that do not annotate their tools.
  # Only read-only tools are offered to background jobs.
  read_only_tools: [ha__GetDateTime, ha__GetLiveContext, ha__HassGetWeather, ha__todo_get_items]

memory:
  profile_schedule: "30 3 * * *"   # nightly: facts -> compact profile (prompt layer 5)
  max_facts_in_layer: 8
  max_profile_chars: 2000

telemetry:
  otlp_endpoint: "localhost:4317"   # empty disables export
  service_name: mira
  capture_content: false            # prompts are private household data
  log_level: info

# Skills: folders with a SKILL.md (Agent Skills format) in skills.dirs.
# Only enabled skills are used. A skill costs one line in the prompt until
# Mira opens it; secret settings (URLs) never reach a model.
skills:
  dirs: [skills]
  enabled:
    abfall:
      calendar_url: "https://example.org/abfallkalender.ics"   # iCal sync link of your waste collector
      types: [Restabfall, Wertstoff]
