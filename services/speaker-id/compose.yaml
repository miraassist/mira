# Speaker ID: a Wyoming STT proxy in front of the real STT that recognizes who spoke (CPU, sherpa-onnx).
# Home Assistant uses it as its STT (port 10310); the transcript is the upstream's, unchanged. Its API for
# Mira is on port 10311, behind SPEAKER_TOKEN (set it in .env next to this file; Mira's speaker_id.token is
# the same). Enrolling happens in Mira's page. Keeps voice prints only, no audio (docs/spec/sprecher.md).
#
#   docker compose -f compose.yaml up -d
#
# That pulls the released image; --build builds it from this folder instead. The service has releases
# of its own (tag speaker-id-vX.Y.Z, .github/workflows/speaker-id.yml), which raises the version below.
# The model is downloaded on the first start, into the data directory.
#
# The voice prints live outside the repository (SPEAKER_ID_DATA), so a worktree or checkout can go
# without taking them along.
services:
  speaker-id:
    image: ghcr.io/miraassist/speaker-id:0.11.0
    build: .
    container_name: speaker-id
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SPEAKER_UPSTREAM=${SPEAKER_UPSTREAM:-tcp://host.docker.internal:10300}
      # wespeaker_en_voxceleb_resnet34_LM.onnx, 3dspeaker_speech_eres2netv2_sv_zh-cn_16k-common.onnx,
      # nemo_en_titanet_small.onnx, ... (sherpa-onnx release "speaker-recongition-models")
      - SPEAKER_MODEL=${SPEAKER_MODEL:-wespeaker_en_voxceleb_resnet34_LM.onnx}
      - SPEAKER_THRESHOLD=${SPEAKER_THRESHOLD:-0.7}
      - SPEAKER_DEBUG=${SPEAKER_DEBUG:-false}
      - SPEAKER_TOKEN=${SPEAKER_TOKEN:-}
    ports:
      - "10310:10310"
      - "10311:10311"
    volumes:
      - ${SPEAKER_ID_DATA:-${HOME}/.local/share/speaker-id}:/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(); s.connect(('localhost',10310)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
