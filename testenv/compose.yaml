# Test Home Assistant for Mira. Same version as the real house, so the Assist
# prompt and the permission rules behave the same. Managed by `go run ./cmd/testha`.
name: mira-testenv

services:
  homeassistant:
    container_name: mira-test-ha
    image: ghcr.io/home-assistant/home-assistant:2026.10.0
    # Bridge network on purpose: in the host network HA discovers the real
    # house (Cast, ESPHome, ...) and sets some of it up by itself.
    ports:
      - "8123:8123"
    # HA reaches the test Mira on the host as host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Europe/Berlin
    volumes:
      - ./ha:/config
      - ../custom_components/mira:/config/custom_components/mira:ro
      # Fake TECHO5 devices (Show, Echo) for tests without real hardware.
      - ./techo5_fake:/config/custom_components/techo5_fake:ro
    restart: "no"

  # A broker of its own for test devices (a Tasmota lamp, say), so they never
  # need the real house's broker. The test HA reaches it as "mosquitto";
  # devices in the LAN as this machine's address, port 1883. No password, like
  # the test HA itself: do not keep it running on a network you do not trust.
  mosquitto:
    container_name: mira-test-mqtt
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    restart: "no"

  # A mail server of its own for the mail calendar (docs/spec/mail-kalender.md):
  # the test HA's IMAP entry (device "Pakete") reads the mailbox pakete@test.local
  # (password pakete, IMAPS with a self-signed certificate: verify_ssl off);
  # `go run ./cmd/testha mail` delivers the sample mails
  # from testenv/mailsamples over SMTP. Kept in memory: a restart empties it.
  greenmail:
    container_name: mira-test-mail
    image: greenmail/standalone:2.1.3
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imaps -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=pakete:pakete@test.local -Dgreenmail.verbose=false
    ports:
      - "3025:3025"
      - "3993:3993"
    restart: "no"

volumes:
  mosquitto-data:
