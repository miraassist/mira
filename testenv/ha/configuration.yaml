# Test Home Assistant for Mira. Runtime files next to this one are not in git.
homeassistant:
  name: Mira Test
  country: DE
  language: de
  time_zone: Europe/Berlin
  unit_system: metric
  currency: EUR
  latitude: 52.52
  longitude: 13.40
  elevation: 40

http:
  server_port: 8123

default_config:

# Lights, switches, sensors, covers, media players and more, without hardware.
demo:

# Mira's tasks are automations here, like in every UI-managed installation.
automation: !include automations.yaml

# Test trackers for the persons: flipping "Sim zu Hause <Person>" reports
# device_tracker.sim_<person> as home or not_home (also at start); `testha
# up` links each tracker to its person.
automation sim:
  - id: mira_test_sim_presence
    alias: Sim Anwesenheit
    mode: queued
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id: [input_boolean.sim_da_admin, input_boolean.sim_da_anna, input_boolean.sim_da_ben]
    actions:
      - repeat:
          for_each: [admin, anna, ben]
          sequence:
            - action: device_tracker.see
              data:
                dev_id: "sim_{{ repeat.item }}"
                location_name: "{{ 'home' if is_state('input_boolean.sim_da_' ~ repeat.item, 'on') else 'not_home' }}"

logger:
  default: warning
  logs:
    custom_components.mira: debug
    homeassistant.components.mcp_server: info

# Test switches that drive the simulated sensors below. Not exposed to Assist;
# `testha set` flips them.
input_boolean:
  sim_leck_keller:
    name: Sim Leck Keller
  sim_leck_kueche:
    name: Sim Leck Küche
  sim_bewegung_flur:
    name: Sim Bewegung Flur
  sim_bewegung_bad:
    name: Sim Bewegung Bad
  sim_fenster_bad:
    name: Sim Fenster Bad
  # Who is home: each drives the person's test tracker (see "automation sim").
  sim_da_admin:
    name: Sim zu Hause Admin
    icon: mdi:home-account
  sim_da_anna:
    name: Sim zu Hause Anna
    icon: mdi:home-account
  sim_da_ben:
    name: Sim zu Hause Ben
    icon: mdi:home-account

template:
  - binary_sensor:
      - name: Lecksensor Keller
        unique_id: mira_test_leck_keller
        device_class: moisture
        state: "{{ is_state('input_boolean.sim_leck_keller', 'on') }}"
      - name: Lecksensor Spülmaschine
        unique_id: mira_test_leck_kueche
        device_class: moisture
        state: "{{ is_state('input_boolean.sim_leck_kueche', 'on') }}"
      - name: Bewegung Flur
        unique_id: mira_test_bewegung_flur
        device_class: motion
        state: "{{ is_state('input_boolean.sim_bewegung_flur', 'on') }}"
      - name: Bewegung Bad
        unique_id: mira_test_bewegung_bad
        device_class: motion
        state: "{{ is_state('input_boolean.sim_bewegung_bad', 'on') }}"
      - name: Fenster Bad
        unique_id: mira_test_fenster_bad
        device_class: window
        state: "{{ is_state('input_boolean.sim_fenster_bad', 'on') }}"
