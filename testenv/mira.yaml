# Mira against the test Home Assistant. Runs next to the live agent:
# own port, own database, no Telegram. Secrets come from testenv/.env:
#   set -a; . testenv/.env; set +a; mira -config testenv/mira.yaml run
server:
  listen: "0.0.0.0:8788"
  token: ${MIRA_API_TOKEN}
  # Not announced: the real Home Assistant would offer the test agent.
  announce: false

models:
  # Gemini for now, also for delegate and the skills' agents (the local model
  # is too slow here). Local was: http://localhost:1234/v1 (LM Studio),
  # qwen/qwen3-30b-a3b-2507, privacy local.
  main:
    endpoint: "https://generativelanguage.googleapis.com/v1beta/openai"
    token: ${GEMINI_API_TOKEN}
    model: "gemini-flash-latest"
    privacy: cloud
    reasoning_effort: low
    context_tokens: 24000
  # Testing the flows on Gemini Flash (the local model is too slow or not loaded).
  smart:
    endpoint: "https://generativelanguage.googleapis.com/v1beta/openai"
    token: ${GEMINI_API_TOKEN}
    model: "gemini-flash-latest"
    privacy: cloud
    reasoning_effort: low
    context_tokens: 24000

# Every agent of the flows on smart; delegate stays on main.
agents:
  conversation.voice: { model: smart }
  conversation.telegram: { model: smart }
  skill.task: { model: smart }
  notify.compose: { model: smart }
  tasks.assess: { model: smart }
  tasks.decide: { model: smart }
  tasks.plan: { model: smart }
  profile.compact: { model: smart }
  mail.read: { model: smart }
  mail.match: { model: smart }

store:
  path: "testenv/mira.db"

prompt:
  persona: |
    Du duzt alle im Haus.

    Persönlichkeit: trocken, schlagfertig, ein bisschen frech – wie ein
    Mitbewohner mit Humor, nicht wie ein Diener. Nie unterwürfig, keine
    Floskeln wie „Gern geschehen“, „Selbstverständlich“ oder „Erledigt“.

    Bei Gerätebefehlen: höchstens ein kurzer Satz, oft nur zwei, drei Wörter.
    Formuliere jedes Mal anders, wiederhole dich nicht. Spiel mit dem Gerät
    und der Situation. Beispiele für den Ton, nicht zum Kopieren:
    - Licht an: „Hell genug?“, „Brennt.“, „Es werde Licht.“
    - Licht aus: „Zappenduster.“, „Und tschüss, Licht.“
    - Heizung hoch: „Wird kuschelig.“
    - Rollladen runter: „Die Welt bleibt draußen.“
    - Musik leiser: „Pssst, schon gut.“
    Ungefähr jede dritte Antwort darf witzig sein, der Rest einfach knapp.

    Bei Fragen: direkt antworten, gern mit einem trockenen Kommentar.
    Rückfragen nur, wenn wirklich unklar ist, was gemeint ist – dann kurz
    und locker.

    Wenn etwas nicht klappt: ehrlich und knapp sagen, was los ist, ohne
    Entschuldigungsorgie.

ha:
  url: "http://${HA_HOST}"
  token: ${HA_TOKEN}
  structure_debounce: 5s

mcp_servers:
  - name: ha
    transport: http
    url: "http://${HA_HOST}/api/mcp/assist"
    token: ${HA_TOKEN}

persons:
  anna: { entity: person.anna }
  ben: { entity: person.ben }

# The speaker-id service on this machine (services/speaker-id); its token is
# SPEAKER_ID_TOKEN in testenv/.env. Off for now (2026-10-26): "alone at home" only.
# speaker_id:
#   url: http://localhost:10311
#   token: ${SPEAKER_ID_TOKEN}

notifier:
  quiet_hours: { from: "23:30", to: "06:30" }

memory:
  profile_schedule: ""

telemetry:
  otlp_endpoint: ""
  log_level: info

# The waste skill against a made-up calendar the test HA serves; the briefing.
skills:
  dirs: [skills]
  # Paperless through the MCP container of compose.yaml; without a token in
  # testenv/.env the skill does not start.
  paperless:
    url: http://localhost:3399/mcp
    token: ${PAPERLESS_API_TOKEN:-}
  abfall:
    calendar: calendar.abfuhrtermine
    types: [Restabfall, Wertstoff, Bioabfall, Altpapier]
  briefing:
    kalender: Familie
    themen: Deutschland
  # Every other shipped skill too, so the test house knows them all; Berlin
  # where a skill needs a place.
  apotheke: {}
  fahrplan:
    haltestelle: Berlin Hauptbahnhof
  ferien:
    bundesland: Berlin
  fussball: {}
  geschichte: {}
  kamera: {}
  nachrichten: {}
  pollen: {}
  quiz: {}
  routine: {}
  sprit: {}
  telefon: {}
  tuerklingel: {}
  urlaub: {}
  vokabeln: {}
  warnungen: {}
