water_run:
  fields:
    litres:
      default: 10
      selector:
        number:
          min: 0.1
          max: 1000
          mode: box
    every:
      default: 300
      selector:
        number:
          min: 1
          max: 86400
          unit_of_measurement: s
          mode: box
    for:
      selector:
        number:
          min: 1
          max: 604800
          unit_of_measurement: s
          mode: box
water_stop:
power:
  fields:
    watts:
      required: true
      selector:
        number:
          min: 0
          max: 5000
          mode: box
routine:
  fields:
    windows:
      required: true
      example: "07:40-11:40, 14:20-21:00"
      selector:
        text:
    watts:
      default: 50
      selector:
        number:
          min: 0
          max: 5000
          mode: box
